<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
		%sveltekit.head%
		<!-- PostHog (analytics + session replay), loaded only with analytics consent. Consent is the
		     a3t_consent cookie shared with a3t.io and docs.a3t.io (domain .a3t.io). Inputs are masked. -->
		<script>
			(function () {
				function loadPostHog() {
					if (window.__posthogLoaded) return;
					window.__posthogLoaded = true;
					// PostHog's official snippet: the stub queues calls until array.js has loaded.
					!function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]);t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+" (stub)"},o="init be ws ys capture js register register_once register_for_session unregister unregister_for_session getFeatureFlag getFeatureFlagPayload isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSessionId getSurveys getActiveMatchingSurveys renderSurvey canRenderSurvey identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty createPersonProfile opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing debug".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
					window.posthog.init('phc_sR3c338cr9qdeSYFZpqbFgZwRWukuVJAuFQiT9qoq3vk', {
						api_host: 'https://eu.i.posthog.com',
						defaults: '2026-08-30'
					});
				}
				function getConsent() {
					try {
						var c = document.cookie.match(/(?:^|;\s*)a3t_consent=([^;]*)/);
						return c ? JSON.parse(decodeURIComponent(c[1])) : null;
					} catch (e) { return null; }
				}
				function setConsent(analytics) {
					var value = encodeURIComponent(JSON.stringify({ necessary: true, analytics: analytics }));
					var expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
					var domain = /(^|\.)a3t\.io$/.test(location.hostname) ? '; domain=.a3t.io' : '';
					document.cookie = 'a3t_consent=' + value + '; expires=' + expires + '; path=/; SameSite=Lax' + domain;
					if (analytics) loadPostHog();
					else if (window.posthog && window.posthog.opt_out_capturing) window.posthog.opt_out_capturing();
					var b = document.getElementById('a3tConsent');
					if (b) b.hidden = true;
				}
				// Profile › Cookie settings opens the banner again.
				window.a3tCookieSettings = function () { var b = document.getElementById('a3tConsent'); if (b) b.hidden = false; };
				window.a3tSetConsent = setConsent;
				var consent = getConsent();
				if (consent && consent.analytics) loadPostHog();
				document.addEventListener('DOMContentLoaded', function () {
					if (!getConsent()) window.a3tCookieSettings();
				});
			})();
		</script>
		<style>
			.a3t-consent { position: fixed; inset-inline: 16px; bottom: 16px; z-index: 10000; max-width: 832px; margin-inline: auto;
				display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 14px 18px;
				background: #fff; color: #1a1a1a; border: 1px solid #e4e1da; border-radius: 12px;
				box-shadow: 0 12px 32px rgba(15, 15, 15, 0.12); font: 13px/1.5 Inter, system-ui, sans-serif; }
			.a3t-consent[hidden] { display: none; }
			.a3t-consent p { flex: 1 1 340px; margin: 0; }
			.a3t-consent strong { display: block; margin-bottom: 2px; }
			.a3t-consent a { color: #4b3fb3; }
			.a3t-consent-actions { display: flex; gap: 8px; }
			.a3t-consent-actions button { padding: 7px 14px; border-radius: 8px; border: 1px solid #d9d5cc; background: #fff;
				color: #1a1a1a; font: inherit; font-weight: 500; cursor: pointer; }
			.a3t-consent-actions button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<div class="a3t-consent" id="a3tConsent" role="region" aria-label="Cookie consent" hidden>
			<p>
				<strong>Your privacy, your choice.</strong>
				We use necessary cookies for the console to work and, with your consent, PostHog analytics and session
				replay to improve A3T. Form inputs are masked. Read our <a href="https://a3t.io/#privacy-policy" target="_blank" rel="noopener">Privacy Policy</a>.
			</p>
			<div class="a3t-consent-actions">
				<button type="button" onclick="window.a3tSetConsent(false)">Reject all</button>
				<button type="button" class="primary" onclick="window.a3tSetConsent(true)">Accept all</button>
			</div>
		</div>
	</body>
</html>
