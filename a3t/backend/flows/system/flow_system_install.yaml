document:
  dsl: 1.0.3
  namespace: system
  name: flow_system_install
  version: 1.2.2
  metadata:
    description: >
      Full A3T platform install: the schema, then the platform template rows
      (tmpl_system_agent_engine, tmpl_a3t_agent, tmpl_a3t_service) where missing.
      Idempotent and additive: rows already there (and their published specs) are
      left alone; a missing row points at its flow (spec_yaml "<namespace>/<name>").
      Requires the a3t-platform-db resource.

metadata:
  a3t:
    extends: system/flow_system_base@1.0.0
do:
  # 1. INSTALL SCHEMA
  - install-schema:
      run:
        workflow:
          namespace: system
          name: flow_system_schema_install
          input: {}

  # 2. Which platform template rows exist already.
  - read-templates:
      call: lancedb
      with:
        operation: query
        table: template_registry
        filter: id = 'tmpl_system_agent_engine' OR id = 'tmpl_a3t_agent' OR id = 'tmpl_a3t_service'
        select:
          - id
        limit: 10
        _resource: a3t/a3t-platform-db
      export:
        as: '${ $context + {_have: ((if type == "array" then . else [] end) | map(.id))} }'

  # 3. The missing ones.
  - pick-missing:
      set:
        _missing: >-
          ${ [ {id: "tmpl_system_agent_engine", ns: "system", version: "2.1.0", published: "false",
                tags: "core,lifecycle,multi-turn,tool-use,memory,knowledge,tool-catalogue,turn-log,rust-native"},
               {id: "tmpl_a3t_agent", ns: "a3t", version: "4.3.0", published: "true",
                tags: "a3t,core,memory,knowledge,tools,turn-log"},
               {id: "tmpl_a3t_service", ns: "a3t", version: "1.0.0", published: "false",
                tags: "a3t,service,control-plane"} ]
             | map(select(.id as $i | ($context._have | index($i)) == null))
             | map({id, org_id: "org-default", name: .id, version, source: "system",
                    spec_yaml: (.ns + "/" + .id), digest: "", signed_by: "system", tags,
                    vertical: "platform", published, created_by: "system",
                    created_at: (now | todateiso8601), updated_at: (now | todateiso8601)}) }
      export:
        as: '${ $context + . }'
  - any-missing:
      switch:
        - some:
            when: '${ ($context._missing | length) > 0 }'
            then: seed-templates
        - none:
            then: verify

  # 4. Seed them.
  - seed-templates:
      call: lancedb
      with:
        operation: insert
        table: template_registry
        records: '${ $context._missing }'
        _resource: a3t/a3t-platform-db

  # 5. VERIFY
  - verify:
      call: lancedb
      with:
        operation: query
        table: template_registry
        filter: created_by = 'system'
        select:
          - id
          - name
          - version
          - tags
        limit: 10
        _resource: a3t/a3t-platform-db
