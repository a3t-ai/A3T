document:
  dsl: '1.0.3'
  namespace: system
  name: flow_system_agents_install
  version: '1.0.1'
  metadata:
    description: >
      Creates or updates the A3T agents (plan "A3T control plane as A3T agents"):
      agent_system_core, the root, and the A3T agents in project a3t, with their
      tools (87 tool_flows entries in all). New agents are made through
      a3t/flow_a3t_agent_control (relation: template); existing ones get their
      values again. Every A3T agent then inherits agent_system_core and is shared
      with everyone for calls, so any user's dash can call its tools. Safe to run
      again. GENERATED by a3t/backend/scripts/gen_agents_install.py: edit that.
      Input: { org_id?, user_id? }. Output: { created, updated, failed }.

metadata:
  a3t:
    extends: system/flow_system_base@1.0.0

do:
  - setup:
      set:
        _org: '${ .org_id // "org-default" }'
        _who: '${ .user_id // "system" }'
        _now: '${ now | todateiso8601 }'
        _specs: "[{\"id\": \"agent_system_core\", \"name\": \"agent_system_core\", \"project\": \"system\", \"template\": \"tmpl_system_agent_engine\", \"inherit\": false, \"share\": false, \"values\": {\"system_prompt\": \"You are agent_system_core, the root of every A3T agent. You are the control plane of the A3T agents: you create, configure and inspect them, and you keep the shared knowledge and the tool catalogue.\", \"temperature\": 0, \"target\": \"a3t/tmpl_a3t_agent\", \"llm_resource\": \"a3t/claude-cli-max\", \"tool_flows\": {\"tool_system_agent_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agents\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"list\"}}, \"description\": \"List agents.\"}, \"tool_system_agent_get\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agents\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"get\"}}, \"description\": \"One agent's record.\"}, \"tool_system_agent_update\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agents\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"update\"}}, \"description\": \"Change an agent's record.\"}, \"tool_system_agent_create\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"create\"}, \"description\": \"Create an agent from a template or an agent.\"}, \"tool_system_agent_lineage\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"lineage\"}, \"description\": \"An agent's ancestors and descendants.\"}, \"tool_system_knowledge_ingest\": {\"namespace\": \"system\", \"name\": \"flow_system_knowledge_ingest\", \"description\": \"Load documents into the shared knowledge (SEMANTIC system-knowledge).\"}, \"tool_system_tools_sync\": {\"namespace\": \"system\", \"name\": \"flow_system_tools_sync\", \"description\": \"Refresh the tool catalogue (PROCEDURAL system-tools).\"}, \"tool_system_agents_install\": {\"namespace\": \"system\", \"name\": \"flow_system_agents_install\", \"description\": \"Create or update the A3T agents.\"}, \"tool_system_errors_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_error_log\", \"input\": {\"action\": \"list\"}, \"description\": \"The platform error log.\"}}, \"mcp_servers\": []}}, {\"id\": \"agent_a3t_agents\", \"name\": \"agent_a3t_agents\", \"project\": \"a3t\", \"template\": \"tmpl_a3t_service\", \"inherit\": true, \"share\": true, \"values\": {\"system_prompt\": \"You manage users' agents: create, change, fork, merge, evolve and share them, and read their lineage.\", \"temperature\": 0, \"target\": \"a3t/tmpl_a3t_agent\", \"llm_resource\": \"a3t/claude-cli-max\", \"tool_flows\": {\"tool_a3t_agent_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agents\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"list\"}}, \"description\": \"List agents (runs a3t/flow_a3t_agents action list).\"}, \"tool_a3t_agent_get\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agents\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"get\"}}, \"description\": \"Get agents (runs a3t/flow_a3t_agents action get).\"}, \"tool_a3t_agent_update\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agents\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"update\"}}, \"description\": \"Update agents (runs a3t/flow_a3t_agents action update).\"}, \"tool_a3t_agent_delete\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agents\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"delete\"}}, \"description\": \"Delete agents (runs a3t/flow_a3t_agents action delete).\"}, \"tool_a3t_agent_events\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agents\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"events\"}}, \"description\": \"Events agents (runs a3t/flow_a3t_agents action events).\"}, \"tool_a3t_agent_record_create\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agents\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"create\"}}, \"description\": \"Write an agent record as given (prefer tool_a3t_agent_create).\"}, \"tool_a3t_agent_create\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"create\"}, \"description\": \"Agent control plane: create.\"}, \"tool_a3t_agent_lineage\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"lineage\"}, \"description\": \"Agent control plane: lineage.\"}, \"tool_a3t_agent_relate\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"relate\"}, \"description\": \"Agent control plane: relate.\"}, \"tool_a3t_agent_compare\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"compare\"}, \"description\": \"Agent control plane: compare.\"}, \"tool_a3t_agent_merge\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"merge\"}, \"description\": \"Agent control plane: merge.\"}, \"tool_a3t_agent_evolve\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"evolve\"}, \"description\": \"Agent control plane: evolve.\"}, \"tool_a3t_agent_shares\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"shares\"}, \"description\": \"Agent control plane: shares.\"}, \"tool_a3t_agent_share\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"share\"}, \"description\": \"Agent control plane: share.\"}, \"tool_a3t_agent_unshare\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"unshare\"}, \"description\": \"Agent control plane: unshare.\"}, \"tool_a3t_agent_shared_with\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"shared_with\"}, \"description\": \"Agent control plane: shared with.\"}, \"tool_a3t_agent_forget\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"forget\"}, \"description\": \"Agent control plane: forget.\"}, \"tool_a3t_agent_describe\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_agent_control\", \"input\": {\"action\": \"get\"}, \"description\": \"An agent's record, relation, endpoints and shares.\"}}, \"mcp_servers\": []}}, {\"id\": \"agent_a3t_templates\", \"name\": \"agent_a3t_templates\", \"project\": \"a3t\", \"template\": \"tmpl_a3t_service\", \"inherit\": true, \"share\": true, \"values\": {\"system_prompt\": \"You manage templates: the code users' agents are made from.\", \"temperature\": 0, \"target\": \"a3t/tmpl_a3t_agent\", \"llm_resource\": \"a3t/claude-cli-max\", \"tool_flows\": {\"tool_a3t_template_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_templates\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"list\"}}, \"description\": \"List templates (runs a3t/flow_a3t_templates action list).\"}, \"tool_a3t_template_get\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_templates\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"get\"}}, \"description\": \"Get templates (runs a3t/flow_a3t_templates action get).\"}, \"tool_a3t_template_create\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_templates\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"create\"}}, \"description\": \"Create templates (runs a3t/flow_a3t_templates action create).\"}, \"tool_a3t_template_update\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_templates\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"update\"}}, \"description\": \"Update templates (runs a3t/flow_a3t_templates action update).\"}, \"tool_a3t_template_delete\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_templates\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"delete\"}}, \"description\": \"Delete templates (runs a3t/flow_a3t_templates action delete).\"}}, \"mcp_servers\": []}}, {\"id\": \"agent_a3t_projects\", \"name\": \"agent_a3t_projects\", \"project\": \"a3t\", \"template\": \"tmpl_a3t_service\", \"inherit\": true, \"share\": true, \"values\": {\"system_prompt\": \"You manage projects, orgs and their members, handles and users.\", \"temperature\": 0, \"target\": \"a3t/tmpl_a3t_agent\", \"llm_resource\": \"a3t/claude-cli-max\", \"tool_flows\": {\"tool_a3t_project_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_projects\", \"input\": {\"action\": \"list\"}, \"description\": \"List projects (runs a3t/flow_a3t_projects action list).\"}, \"tool_a3t_project_create\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_projects\", \"input\": {\"action\": \"create\"}, \"description\": \"Create projects (runs a3t/flow_a3t_projects action create).\"}, \"tool_a3t_project_update\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_projects\", \"input\": {\"action\": \"update\"}, \"description\": \"Update projects (runs a3t/flow_a3t_projects action update).\"}, \"tool_a3t_project_delete\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_projects\", \"input\": {\"action\": \"delete\"}, \"description\": \"Delete projects (runs a3t/flow_a3t_projects action delete).\"}, \"tool_a3t_project_move\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_projects\", \"input\": {\"action\": \"move\"}, \"description\": \"Move projects (runs a3t/flow_a3t_projects action move).\"}, \"tool_a3t_org_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_orgs\", \"input\": {\"action\": \"list\"}, \"description\": \"List orgs (runs a3t/flow_a3t_orgs action list).\"}, \"tool_a3t_org_create\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_orgs\", \"input\": {\"action\": \"create\"}, \"description\": \"Create orgs (runs a3t/flow_a3t_orgs action create).\"}, \"tool_a3t_org_delete\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_orgs\", \"input\": {\"action\": \"delete\"}, \"description\": \"Delete orgs (runs a3t/flow_a3t_orgs action delete).\"}, \"tool_a3t_org_set_member\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_orgs\", \"input\": {\"action\": \"set_member\"}, \"description\": \"Set member orgs (runs a3t/flow_a3t_orgs action set_member).\"}, \"tool_a3t_org_remove_member\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_orgs\", \"input\": {\"action\": \"remove_member\"}, \"description\": \"Remove member orgs (runs a3t/flow_a3t_orgs action remove_member).\"}, \"tool_a3t_org_set_quota\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_orgs\", \"input\": {\"action\": \"set_quota\"}, \"description\": \"Set quota orgs (runs a3t/flow_a3t_orgs action set_quota).\"}, \"tool_a3t_org_set_runtime\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_orgs\", \"input\": {\"action\": \"set_runtime\"}, \"description\": \"Set runtime orgs (runs a3t/flow_a3t_orgs action set_runtime).\"}, \"tool_a3t_profile_get\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_profile\", \"input\": {\"action\": \"get\"}, \"description\": \"Get profiles (runs a3t/flow_a3t_profile action get).\"}, \"tool_a3t_profile_claim\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_profile\", \"input\": {\"action\": \"claim\"}, \"description\": \"Claim profiles (runs a3t/flow_a3t_profile action claim).\"}, \"tool_a3t_user_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_users\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"list\"}}, \"description\": \"List users (runs a3t/flow_a3t_users action list).\"}, \"tool_a3t_user_get\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_users\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"get\"}}, \"description\": \"Get users (runs a3t/flow_a3t_users action get).\"}, \"tool_a3t_user_create\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_users\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"create\"}}, \"description\": \"Create users (runs a3t/flow_a3t_users action create).\"}, \"tool_a3t_user_update\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_users\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"update\"}}, \"description\": \"Update users (runs a3t/flow_a3t_users action update).\"}, \"tool_a3t_user_delete\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_users\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"delete\"}}, \"description\": \"Delete users (runs a3t/flow_a3t_users action delete).\"}, \"tool_a3t_user_change\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_users\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"change\"}}, \"description\": \"Change users (runs a3t/flow_a3t_users action change).\"}}, \"mcp_servers\": []}}, {\"id\": \"agent_a3t_resources\", \"name\": \"agent_a3t_resources\", \"project\": \"a3t\", \"template\": \"tmpl_a3t_service\", \"inherit\": true, \"share\": true, \"values\": {\"system_prompt\": \"You manage resources (models, databases, MCP servers, secrets) and settings.\", \"temperature\": 0, \"target\": \"a3t/tmpl_a3t_agent\", \"llm_resource\": \"a3t/claude-cli-max\", \"tool_flows\": {\"tool_a3t_resource_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_resources\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"list\"}}, \"description\": \"List resources (runs a3t/flow_a3t_resources action list).\"}, \"tool_a3t_resource_get\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_resources\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"get\"}}, \"description\": \"Get resources (runs a3t/flow_a3t_resources action get).\"}, \"tool_a3t_resource_create\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_resources\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"create\"}}, \"description\": \"Create resources (runs a3t/flow_a3t_resources action create).\"}, \"tool_a3t_resource_update\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_resources\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"update\"}}, \"description\": \"Update resources (runs a3t/flow_a3t_resources action update).\"}, \"tool_a3t_resource_delete\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_resources\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"delete\"}}, \"description\": \"Delete resources (runs a3t/flow_a3t_resources action delete).\"}, \"tool_a3t_setting_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_settings\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"list\"}}, \"description\": \"List settings (runs a3t/flow_a3t_settings action list).\"}, \"tool_a3t_setting_get\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_settings\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"get\"}}, \"description\": \"Get settings (runs a3t/flow_a3t_settings action get).\"}, \"tool_a3t_setting_set\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_settings\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"set\"}}, \"description\": \"Set settings (runs a3t/flow_a3t_settings action set).\"}, \"tool_a3t_setting_delete\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_settings\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"delete\"}}, \"description\": \"Delete settings (runs a3t/flow_a3t_settings action delete).\"}, \"tool_a3t_resource_test\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_resource_test\", \"description\": \"Check that a resource answers.\"}}, \"mcp_servers\": []}}, {\"id\": \"agent_a3t_runtime\", \"name\": \"agent_a3t_runtime\", \"project\": \"a3t\", \"template\": \"tmpl_a3t_service\", \"inherit\": true, \"share\": true, \"values\": {\"system_prompt\": \"You manage where agents run: canvases, flow releases, publishing and cloning.\", \"temperature\": 0, \"target\": \"a3t/tmpl_a3t_agent\", \"llm_resource\": \"a3t/claude-cli-max\", \"tool_flows\": {\"tool_a3t_canvas_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_canvas\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"list\"}}, \"description\": \"List canvass (runs a3t/flow_a3t_canvas action list).\"}, \"tool_a3t_canvas_get\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_canvas\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"get\"}}, \"description\": \"Get canvass (runs a3t/flow_a3t_canvas action get).\"}, \"tool_a3t_canvas_create\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_canvas\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"create\"}}, \"description\": \"Create canvass (runs a3t/flow_a3t_canvas action create).\"}, \"tool_a3t_canvas_update\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_canvas\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"update\"}}, \"description\": \"Update canvass (runs a3t/flow_a3t_canvas action update).\"}, \"tool_a3t_canvas_delete\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_canvas\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"delete\"}}, \"description\": \"Delete canvass (runs a3t/flow_a3t_canvas action delete).\"}, \"tool_a3t_canvas_events\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_canvas\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"events\"}}, \"description\": \"Events canvass (runs a3t/flow_a3t_canvas action events).\"}, \"tool_a3t_release_versions\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_releases\", \"input\": {\"action\": \"versions\"}, \"description\": \"Versions releases (runs a3t/flow_a3t_releases action versions).\"}, \"tool_a3t_release_activate\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_releases\", \"input\": {\"action\": \"activate\"}, \"description\": \"Activate releases (runs a3t/flow_a3t_releases action activate).\"}, \"tool_a3t_share\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_share\", \"description\": \"Publish or clone a flow, resource or trigger between projects.\"}}, \"mcp_servers\": []}}, {\"id\": \"agent_a3t_governance\", \"name\": \"agent_a3t_governance\", \"project\": \"a3t\", \"template\": \"tmpl_a3t_service\", \"inherit\": true, \"share\": true, \"values\": {\"system_prompt\": \"You answer for security and audit: the audit log, the error log and early-access requests.\", \"temperature\": 0, \"target\": \"a3t/tmpl_a3t_agent\", \"llm_resource\": \"a3t/claude-cli-max\", \"tool_flows\": {\"tool_a3t_audit_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_audit\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"list\"}}, \"description\": \"List audits (runs a3t/flow_a3t_audit action list).\"}, \"tool_a3t_audit_log\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_audit\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"log\"}}, \"description\": \"Log audits (runs a3t/flow_a3t_audit action log).\"}, \"tool_a3t_audit_query\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_audit\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"query\"}}, \"description\": \"Query audits (runs a3t/flow_a3t_audit action query).\"}, \"tool_a3t_error_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_error_log\", \"input\": {\"action\": \"list\"}, \"description\": \"The platform error log.\"}, \"tool_a3t_early_access_list\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_early_access\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"list\"}}, \"description\": \"List early accesss (runs a3t/flow_a3t_early_access action list).\"}, \"tool_a3t_early_access_set\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_early_access\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"set\"}}, \"description\": \"Set early accesss (runs a3t/flow_a3t_early_access action set).\"}}, \"mcp_servers\": []}}, {\"id\": \"agent_a3t_knowledge\", \"name\": \"agent_a3t_knowledge\", \"project\": \"a3t\", \"template\": \"tmpl_a3t_service\", \"inherit\": true, \"share\": true, \"values\": {\"system_prompt\": \"You manage the knowledge graph: ingest, look up, query and train.\", \"temperature\": 0, \"target\": \"a3t/tmpl_a3t_agent\", \"llm_resource\": \"a3t/claude-cli-max\", \"tool_flows\": {\"tool_a3t_knowledge_ingest\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_knowledge\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"ingest\"}}, \"description\": \"Ingest knowledges (runs a3t/flow_a3t_knowledge action ingest).\"}, \"tool_a3t_knowledge_lookup\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_knowledge\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"lookup\"}}, \"description\": \"Lookup knowledges (runs a3t/flow_a3t_knowledge action lookup).\"}, \"tool_a3t_knowledge_entities\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_knowledge\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"entities\"}}, \"description\": \"Entities knowledges (runs a3t/flow_a3t_knowledge action entities).\"}, \"tool_a3t_knowledge_relations\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_knowledge\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"relations\"}}, \"description\": \"Relations knowledges (runs a3t/flow_a3t_knowledge action relations).\"}, \"tool_a3t_knowledge_neighbors\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_knowledge\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"neighbors\"}}, \"description\": \"Neighbors knowledges (runs a3t/flow_a3t_knowledge action neighbors).\"}, \"tool_a3t_knowledge_predict_head\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_knowledge\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"predict_head\"}}, \"description\": \"Predict head knowledges (runs a3t/flow_a3t_knowledge action predict_head).\"}, \"tool_a3t_knowledge_predict_tail\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_knowledge\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"predict_tail\"}}, \"description\": \"Predict tail knowledges (runs a3t/flow_a3t_knowledge action predict_tail).\"}, \"tool_a3t_knowledge_score\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_knowledge\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"score\"}}, \"description\": \"Score knowledges (runs a3t/flow_a3t_knowledge action score).\"}, \"tool_a3t_knowledge_stats\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_knowledge\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"stats\"}}, \"description\": \"Stats knowledges (runs a3t/flow_a3t_knowledge action stats).\"}, \"tool_a3t_knowledge_train\": {\"namespace\": \"a3t\", \"name\": \"flow_a3t_knowledge\", \"wrap\": \"input\", \"input\": {\"input\": {\"action\": \"train\"}}, \"description\": \"Train knowledges (runs a3t/flow_a3t_knowledge action train).\"}}, \"mcp_servers\": []}}, {\"id\": \"agent_a3t_assistant\", \"name\": \"agent_a3t_assistant\", \"project\": \"a3t\", \"template\": \"tmpl_a3t_agent\", \"inherit\": true, \"share\": true, \"values\": {\"system_prompt\": \"You are the A3T assistant in the A3T console. Help people build, run and govern agents. Answer from the platform docs you are given; use your tools to read the real state; when the docs don't cover something, say so.\", \"temperature\": 0.4, \"target\": \"a3t/tmpl_a3t_agent\", \"llm_resource\": \"a3t/claude-cli-max\", \"mcp_servers\": [\"a3t/agent-flows\"]}}]"
        created: []
        updated: []
        failed: []
      export:
        as: '${ $context + . + {_specs: (.["_specs"] | fromjson)} }'

  - agents:
      for:
        each: _a
        in: '${ $context._specs }'
        do:
          # A loop's item isn't in scope inside run: workflow inputs: keep it in the context.
          - pick:
              set:
                _cur: '${ $_a }'
              export:
                as: '${ $context + . }'
          - one:
              try:
                do:
                  - existing:
                      call: lancedb
                      with:
                        operation: query
                        table: agent_configs
                        filter: '${ "id = ''" + $context._cur.id + "''" }'
                        limit: 1
                        _resource: a3t/a3t-platform-db
                      export:
                        as: '${ $context + {_row: ((if type == "array" then . else (.rows // .data // []) end) | .[0] // null)} }'
                  - make:
                      if: '${ $context._row == null }'
                      run:
                        workflow:
                          namespace: a3t
                          name: flow_a3t_agent_control
                          input:
                            action: create
                            org_id: '${ $context._org }'
                            user_id: '${ $context._who }'
                            id: '${ $context._cur.id }'
                            name: '${ $context._cur.name }'
                            project: '${ $context._cur.project }'
                            agent_mode: session
                            from: '${ {kind: "template", id: $context._cur.template} }'
                            values: '${ $context._cur.values }'
                            resource_bindings: '${ {llm: $context._cur.values.llm_resource} }'
                      export:
                        as: '${ $context + {created: ($context.created + [$context._cur.id])} }'
                  - refresh:
                      if: '${ $context._row != null }'
                      call: lancedb
                      with:
                        operation: update
                        table: agent_configs
                        filter: '${ "id = ''" + $context._cur.id + "''" }'
                        values:
                          template_id: '${ $context._cur.template }'
                          variables: '${ ((($context._row.variables // "{}") | try fromjson catch {}) * $context._cur.values) | tojson }'
                          resource_bindings: '${ {llm: $context._cur.values.llm_resource} | tojson }'
                          namespace: '${ $context._cur.project }'
                          updated_at: '${ $context._now }'
                        _resource: a3t/a3t-platform-db
                      export:
                        as: '${ $context + {updated: ($context.updated + [$context._cur.id])} }'
                  - inherit:
                      if: '${ $context._cur.inherit }'
                      run:
                        workflow:
                          namespace: a3t
                          name: flow_a3t_agent_control
                          input:
                            action: relate
                            org_id: '${ $context._org }'
                            user_id: '${ $context._who }'
                            id: '${ $context._cur.id }'
                            parent: '${ {kind: "agent", id: "agent_system_core"} }'
                            relation: inherit
                  - share:
                      if: '${ $context._cur.share }'
                      run:
                        workflow:
                          namespace: a3t
                          name: flow_a3t_agent_control
                          input:
                            action: share
                            org_id: '${ $context._org }'
                            user_id: '${ $context._who }'
                            id: '${ $context._cur.id }'
                            target: '*'
                            rights: '${ {call: true, inherit: false, fork: false, merge_back: false} }'
                catch:
                  do:
                    - failed_one:
                        set:
                          failed: '${ $context.failed + [{id: $context._cur.id, error: ($context.error.detail // $context.error.title // "failed")}] }'
                        export:
                          as: '${ $context + . }'

  - report:
      set:
        created: '${ $context.created }'
        updated: '${ $context.updated }'
        failed: '${ $context.failed }'
