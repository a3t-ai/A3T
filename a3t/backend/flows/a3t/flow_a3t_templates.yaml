document:
  dsl: 1.0.3
  namespace: a3t
  name: flow_a3t_templates
  version: 1.2.0
# Request/response for the dash: a run that is interrupted is retried by the
# caller, so it keeps no step journal (spec §5.15).
metadata:
  a3t:
    extends: system/flow_system_base@1.0.0
    durability: transient
do:
- route:
    switch:
    - case:
        when: ${ .input.action == "list" }
        then: list
    - case:
        when: ${ .input.action == "get" }
        then: get
    - case:
        when: ${ .input.action == "create" }
        then: create
    - case:
        when: ${ .input.action == "update" }
        then: update
    - case:
        when: ${ .input.action == "delete" }
        then: delete
- list:
    call: lancedb
    with:
      operation: query
      table: template_registry
      filter: org_id = "${ .input.org_id }"
      limit: 100
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: read
          resource:
            type: Template
    export:
      as: '${ $context + {_rows: (if type == "array" then . else (.rows // []) end)} }'
    then: with-specs
- get:
    call: lancedb
    with:
      operation: query
      table: template_registry
      filter: id = "${ .input.id }" AND org_id = "${ .input.org_id }"
      limit: 1
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: read
          resource:
            type: Template
            id: ${ .input.id }
    export:
      as: '${ $context + {_rows: (if type == "array" then . else (.rows // []) end)} }'
    then: with-specs
# A built-in template's row points at its flow (spec_yaml "<namespace>/<tmpl_name>",
# written by flow_system_install): answer with the flow's code, so every reader
# (Templates, Agents, Studio) gets YAML. spec_ref keeps the pointer.
- with-specs:
    call: registry
    with:
      operation: template_specs
      refs: '${ [ $context._rows[] | (.spec_yaml // "") | select(test("^[A-Za-z0-9_.-]+/tmpl_[A-Za-z0-9_.-]+$")) ] }'
    output:
      as: '${ (.specs // {}) as $s | [ $context._rows[] | ((.spec_yaml // "") as $r | if $s[$r] then . + {spec_yaml: $s[$r].yaml, spec_ref: $r, spec_version: $s[$r].version} else . end) ] }'
    then: end
- create:
    set:
      _cr_id: ${ .input.data.id }
      _cr_org: ${ .input.org_id }
      _cr_name: ${ .input.data.name }
      _cr_version: ${ .input.data.version }
      _cr_source: ${ .input.data.source }
      _cr_spec: ${ .input.data.spec_yaml }
      _cr_tags: ${ .input.data.tags }
      _cr_vertical: ${ .input.data.vertical }
      _cr_user: ${ .input.user_id }
      _cr_ts: ${ .input.timestamp }
      _cr_replace: ${ .input.data.replace == true }
      # The project the template belongs to: its spec's document.namespace.
      _cr_ns: >-
        ${ ((([(.input.data.spec_yaml // "") | capture("\n\\s+namespace:\\s*['\"]?(?<ns>[A-Za-z0-9_.-]+)")] | .[0]) // {}).ns) // "" }
    export:
      as: "."
    then: create-check
- create-check:
    call: lancedb
    with:
      operation: query
      table: template_registry
      filter: (name = "${ $context._cr_name }" OR id = "${ $context._cr_id }") AND org_id = "${ $context._cr_org }"
      limit: 100
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: read
          resource:
            type: Template
    then: create-same
# A release is name + version, unique per project (spec namespace): a project
# can hold a release of a template another has, and several versions of it.
- create-same:
    set:
      _cr_same: >-
        ${ [ .[] | select(.name == $context._cr_name and ((([(.spec_yaml // "") | capture("\n\\s+namespace:\\s*['\"]?(?<ns>[A-Za-z0-9_.-]+)")] | .[0]) // {}).ns) == $context._cr_ns and .version == $context._cr_version) ] }
      # One catalogue row per template id: its versions are FlowR's (the flow's).
      _cr_id_taken: '${ ([ .[] | select(.id == $context._cr_id) ] | length) > 0 }'
    export:
      as: "."
- create-decide:
    switch:
    - replace:
        when: ${ (($context._cr_same | length) > 0 or $context._cr_id_taken) and $context._cr_replace }
        then: create-replace
    - case:
        when: ${ ($context._cr_same | length) > 0 }
        then: create-exists
    - taken:
        when: ${ $context._cr_id_taken }
        then: create-taken
    - default:
        then: create-insert
# Re-publishing: the release in that project is updated in place.
- create-replace:
    call: lancedb
    with:
      operation: update
      table: template_registry
      filter: id = "${ ($context._cr_same[0] // {}).id // $context._cr_id }"
      values:
        version: ${ $context._cr_version }
        spec_yaml: ${ $context._cr_spec }
        tags: ${ $context._cr_tags }
        vertical: ${ $context._cr_vertical }
        updated_at: ${ $context._cr_ts }
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: write
          resource:
            type: Template
    then: end
- create-exists:
    set:
      error: '${ $context._cr_name + " " + $context._cr_version + " is already released in " + (if $context._cr_ns == "" then "this project" else $context._cr_ns end) + " — a release is never replaced. Give it a new version to release a change." }'
      name: ${ $context._cr_name }
    then: end
- create-taken:
    set:
      error: '${ "A template with id " + $context._cr_id + " exists already: publish a new version of it (its code, in Studio), or give this one another id." }'
      name: ${ $context._cr_name }
    then: end
- create-insert:
    call: lancedb
    with:
      operation: insert
      table: template_registry
      records:
      - id: ${ $context._cr_id }
        org_id: ${ $context._cr_org }
        name: ${ $context._cr_name }
        version: ${ $context._cr_version }
        source: ${ $context._cr_source }
        spec_yaml: ${ $context._cr_spec }
        digest: ''
        signed_by: ''
        tags: ${ $context._cr_tags }
        vertical: ${ $context._cr_vertical }
        published: 'false'
        created_by: ${ $context._cr_user }
        created_at: ${ $context._cr_ts }
        updated_at: ${ $context._cr_ts }
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: write
          resource:
            type: Template
    then: end
- update:
    call: lancedb
    with:
      operation: update
      table: template_registry
      filter: id = "${ .input.id }" AND org_id = "${ .input.org_id }"
      values:
        name: ${ .input.data.name // "" }
        version: ${ .input.data.version // "1.0.0" }
        source: ${ .input.data.source // "my" }
        spec_yaml: ${ .input.data.spec_yaml // "" }
        tags: ${ .input.data.tags // "" }
        vertical: ${ .input.data.vertical // "" }
        digest: ${ .input.data.digest // "" }
        signed_by: ${ .input.data.signed_by // "" }
        published: ${ .input.data.published // "false" }
        updated_at: ${ .input.timestamp }
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: write
          resource:
            type: Template
            id: ${ .input.id }
    then: end
- delete:
    call: lancedb
    with:
      operation: delete
      table: template_registry
      filter: id = "${ .input.id }" AND org_id = "${ .input.org_id }"
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: delete
          resource:
            type: Template
            id: ${ .input.id }
    then: delete-check
# A delete that matched nothing deleted nothing: say so, never "deleted".
- delete-check:
    switch:
    - none:
        when: '${ .deleted == false }'
        then: delete-none
    - default:
        then: end
- delete-none:
    raise:
      error:
        type: https://a3t.io/errors/input
        status: 404
        title: Not found
        detail: No template with that id in this org (give its id and org_id), so nothing was deleted.
