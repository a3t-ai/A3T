document:
  dsl: 1.0.3
  namespace: a3t
  name: flow_a3t_users
  version: 1.2.0
# Request/response for the dash: a run that is interrupted is retried by the
# caller, so it keeps no step journal (spec §5.15).
metadata:
  a3t:
    extends: system/flow_system_base@1.0.0
    durability: transient
do:
- route:
    switch:
    # Ids go into a filter string: a quote could widen it to every user.
    - bad-id:
        when: ${ [.input.id, .input.org_id] | map(select(. != null) | tostring | test("[\"'\\\\]")) | any }
        then: deny-id
    # A3T local accounts sign in with the role stored here, so creating them or
    # changing their role, status or password is a SuperAdmin's job alone.
    - writes-need-superadmin:
        when: ${ .input.action as $a | (["create", "update", "update-role", "delete"] | index($a) != null) and ((($context._principal // {}).roles // []) | index("SuperAdmin") == null) }
        then: deny-write
    - case:
        when: ${ .input.action == "list" }
        then: list
    - case:
        when: ${ .input.action == "get" }
        then: get
    - case:
        when: ${ .input.action == "create" }
        then: create
    - case:
        when: ${ .input.action == "update" }
        then: update
    - case:
        when: ${ .input.action == "delete" }
        then: delete
    - case:
        when: ${ .input.action == "update-role" }
        then: update-role
    - case:
        when: ${ .input.action == "change-password" }
        then: cp-moved
- deny-id:
    set:
      ok: false
      error: That user id isn't valid.
    then: end
- deny-write:
    set:
      ok: false
      error: Only a SuperAdmin can create, change or delete A3T accounts. Manage people in Security › Identity.
    then: end
- cp-moved:
    set:
      ok: false
      error: Passwords are changed with POST /auth/change-password, which checks your current password.
    then: end
- list:
    call: lancedb
    with:
      operation: query
      table: users
      filter: org_id = "${ .input.org_id }"
      select:
      - id
      - org_id
      - email
      - name
      - role
      - status
      - created_at
      - last_login_at
      limit: 100
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: read
          resource:
            type: User
    then: end
- get:
    call: lancedb
    with:
      operation: query
      table: users
      filter: id = "${ .input.id }" AND org_id = "${ .input.org_id }"
      select:
      - id
      - org_id
      - email
      - name
      - role
      - status
      - avatar
      - created_at
      - last_login_at
      limit: 1
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: read
          resource:
            type: User
            id: ${ .input.id }
    then: end
- create:
    call: lancedb
    with:
      operation: insert
      table: users
      records:
      - id: ${ .input.data.id }
        org_id: ${ .input.org_id }
        email: ${ .input.data.email }
        name: ${ .input.data.name }
        password_hash: ${ .input.data.password_hash }
        role: ${ .input.data.role }
        avatar: ''
        status: active
        last_login_at: ''
        created_at: ${ .input.timestamp }
        updated_at: ${ .input.timestamp }
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: write
          resource:
            type: User
    then: end
- update:
    call: lancedb
    with:
      operation: update
      table: users
      filter: id = "${ .input.id }" AND org_id = "${ .input.org_id }"
      values:
        email: ${ .input.data.email // "" }
        name: ${ .input.data.name // "" }
        password_hash: ${ .input.data.password_hash // "" }
        role: ${ .input.data.role // "" }
        avatar: ${ .input.data.avatar // "" }
        status: ${ .input.data.status // "active" }
        last_login_at: ${ .input.data.last_login_at // "" }
        updated_at: ${ .input.timestamp }
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: write
          resource:
            type: User
            id: ${ .input.id }
    then: end
- update-role:
    call: lancedb
    with:
      operation: update
      table: users
      filter: id = "${ .input.id }" AND org_id = "${ .input.org_id }"
      values:
        role: ${ .input.data.role }
        updated_at: ${ .input.timestamp }
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: write
          resource:
            type: User
            id: ${ .input.id }
    then: end
- delete:
    call: lancedb
    with:
      operation: delete
      table: users
      filter: id = "${ .input.id }" AND org_id = "${ .input.org_id }"
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: delete
          resource:
            type: User
            id: ${ .input.id }
    then: end
