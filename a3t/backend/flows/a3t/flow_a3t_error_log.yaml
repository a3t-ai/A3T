document:
  dsl: 1.0.3
  namespace: a3t
  name: flow_a3t_error_log
  version: 1.0.0
  metadata:
    description: >
      Reads the A3T error log (a3t_errors), written by system/flow_system_error_handler
      (UX ST-1, F5). Input: { action: "list", flow?, class?, run_id?, since?,
      limit? }. Output: { ok, errors: [newest first], counts: {class: n} } or
      { ok: false, error }. Admin and SuperAdmin (decided 5 Nov). Rows have no org yet,
      so any org's Admin sees every org's errors, and rows can hold other users'
      details. Per-agent and per-org views come with agent ids on runs (UI-2).
# Request/response for the dash: a run that is interrupted is retried by the
# caller, so it keeps no step journal (spec §5.15).
metadata:
  a3t:
    extends: system/flow_system_base@1.0.0
    durability: transient
do:
- whoami:
    set:
      _admin: '${ (($context._principal // {}).roles // []) | (index("Admin") != null or index("SuperAdmin") != null) }'
      _args: '${ (.input // .) }'
    export:
      as: .
- check:
    switch:
    - not-admin:
        when: '${ $context._admin != true }'
        then: deny
    - not-list:
        when: '${ ($context._args.action // "list") != "list" }'
        then: unknown
    - default:
        then: read
- deny:
    set:
      ok: false
      error: Only an admin can read the error log.
    then: end
- unknown:
    set:
      ok: false
      error: '${ "Unknown action: " + ($context._args.action | tostring) }'
    then: end
- read:
    try:
      do:
      - query:
          call: lancedb
          with:
            operation: query
            table: a3t_errors
            # Filter values lose quotes and backslashes: they come from the caller.
            filter: >-
              ${ $context._args as $a
              | [ (if $a.flow then "flow = \"" + ($a.flow | tostring | gsub("[\"'\\\\]"; "")) + "\"" else empty end),
                  (if $a.class then "class = \"" + ($a.class | tostring | gsub("[\"'\\\\]"; "")) + "\"" else empty end),
                  (if $a.run_id then "run_id = \"" + ($a.run_id | tostring | gsub("[\"'\\\\]"; "")) + "\"" else empty end),
                  (if $a.since then "created_at >= \"" + ($a.since | tostring | gsub("[\"'\\\\]"; "")) + "\"" else empty end) ]
              | if length == 0 then null else join(" AND ") end }
            limit: 5000
            _resource: a3t/a3t-platform-db
      catch:
        do:
        - no-table:
            # No table yet means nothing has failed since install.
            set:
              rows: []
            output:
              as: '${ [] }'
- shape:
    set:
      ok: true
      errors: '${ (if type == "array" then . else [] end) | sort_by(.created_at) | reverse | .[0:($context._args.limit // 200)] }'
      counts: '${ (if type == "array" then . else [] end) | group_by(.class) | map({key: .[0].class, value: length}) | from_entries }'
