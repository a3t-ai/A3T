document:
  dsl: 1.0.3
  namespace: a3t
  name: flow_a3t_orgs
  version: 1.4.2
  metadata:
    description: >
      Organisations and their members. A user is independent and can be in
      several orgs, as member, admin or securityadmin. Superadmin creates and
      deletes orgs; superadmin or the org's admins manage its members.
      Input: { action: list | create | delete | set_member | remove_member | set_runtime | set_quota | set_sso, ... }.
      Sign-in per org (set_sso { org, idp_alias, domains }): superadmin or the
      org's admins. idp_alias names the org's identity provider in Keycloak realm
      a3t; FlowR places a user who signs in through it in this org only, with the
      role its policy file access/org.yaml gives their groups (GOV-5: versioned and
      switched like the org's other policy files; no file = no membership).
      Members added at sign-in carry added_by "sso" and are rewritten at every
      sign-in; members added here are invites and sign-in never touches them.
      Platform SecurityAdmin and an org's securityadmin see its members and
      sign-in (can_audit) without changing them; Security › Identity shows them.
      See .ai/A3T_ORG_SSO_SPEC.md.
      Org quota (set_quota { org, max_active_runs }): superadmin only. FlowR refuses new runs
      once the org has that many active across its projects (AC-18).
      Runtime policy (set_runtime { org, runtime: isolated | shared }): an
      isolated org's flows run only on its own runtimes (label a3t.io/org);
      shared ones on the platform's shared runtimes. FlowR enforces it at placement.
      Output: { ok, orgs? , error? }. The caller is $context._principal.
# Request/response for the dash: a run that is interrupted is retried by the
# caller, so it keeps no step journal (spec §5.15).
metadata:
  a3t:
    extends: system/flow_system_base@1.0.0
    durability: transient
do:
- whoami:
    set:
      _me: '${ ($context._principal // {}).user }'
      _super: '${ (($context._principal // {}).roles // []) | index("SuperAdmin") != null }'
      _sec: '${ (($context._principal // {}).roles // []) | index("SecurityAdmin") != null }'
      _args: '${ . }'
    export:
      as: "."
- signed-in:
    switch:
    - anonymous:
        when: '${ $context._me == null }'
        then: deny
    - default:
        then: load-orgs
- deny:
    set:
      ok: false
      error: Sign in to see organisations.
    then: end
- load-orgs:
    call: lancedb
    with:
      operation: query
      table: orgs
      limit: 1000
      _resource: a3t/a3t-platform-db
    # One row per org id: an install that seeded twice has duplicates; the
    # oldest row is the org.
    export:
      as: '{_orgs: (group_by(.id) | map(sort_by(.created_at) | .[0]))}'
- load-members:
    call: lancedb
    with:
      operation: query
      table: org_members
      limit: 10000
      _resource: a3t/a3t-platform-db
    export:
      as: '{_members: .}'
# Who may change each org's identity (org_governance.identity_lock: "security"
# lets only its security admins; FlowR makes the table at start).
- load-governance:
    call: lancedb
    with:
      operation: query
      table: org_governance
      limit: 10000
      _resource: a3t/a3t-platform-db
    export:
      as: '{_gov: .}'
# Every org with its members and the caller's role in it; a non-superadmin
# sees only the orgs they belong to.
- shape:
    set:
      _view: >-
        ${ [ $context._orgs[] | . as $o
             | ($context._members | map(select(.org_id == $o.id))) as $m
             | (($m | map(select(.user_id == $context._me)) | .[0]) // {}).role as $mine
             | select($context._super or $context._sec or $mine != null)
             | { id: $o.id, handle: $o.slug, display_name: $o.name, created_at: $o.created_at,
                 my_role: $mine,
                 runtime: ((($o.settings // "{}") | fromjson).runtime // "shared"),
                 can_admin: ($context._super or $mine == "admin"),
                 # Members and sign-in: SuperAdmin, SecurityAdmin, the org's security
                 # admins, and its admins unless the org locks identity to security admins.
                 can_identity: ($context._super or $context._sec or $mine == "securityadmin"
                   or ($mine == "admin" and ((($context._gov | map(select(.org == $o.slug)) | .[0]) // {}).identity_lock // "both") != "security")),
                 can_audit: ($context._super or $context._sec or $mine == "admin" or $mine == "securityadmin"),
                 sso: (if ($context._super or $context._sec or $mine == "admin" or $mine == "securityadmin") then ((($o.settings // "{}") | fromjson).sso // null) else null end),
                 members: ($m | map({ user_id, email, name, role, source: (if .added_by == "sso" then "sso" else "invite" end) })) } ] }
      _target: '${ $context._orgs | map(select(.slug == ($context._args.org // ""))) | .[0] // null }'
    export:
      as: "."
- route:
    switch:
    - create:
        when: '${ $context._args.action == "create" }'
        then: create-check
    - delete:
        when: '${ $context._args.action == "delete" }'
        then: delete-check
    - set-member:
        when: '${ $context._args.action == "set_member" }'
        then: member-check
    - remove-member:
        when: '${ $context._args.action == "remove_member" }'
        then: member-check
    - set-runtime:
        when: '${ $context._args.action == "set_runtime" }'
        then: runtime-check
    - set-quota:
        when: '${ $context._args.action == "set_quota" }'
        then: quota-check
    - set-sso:
        when: '${ $context._args.action == "set_sso" }'
        then: sso-check
    - default:
        then: list
- list:
    set:
      ok: true
      orgs: '${ $context._view }'
    then: end

# ── create (superadmin) ──
- create-check:
    switch:
    - not-super:
        when: '${ $context._super != true }'
        then: need-super
    - malformed:
        when: '${ ($context._args.org // "") | test("^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$") | not }'
        then: bad-handle
    - reserved:
        when: '${ ["a3t", "system", "admin", "api", "p", "www", "platform", "org", "user"] | index($context._args.org) != null }'
        then: reserved
    - exists:
        when: '${ $context._target != null }'
        then: taken
    - default:
        then: create-find-profile
- need-super:
    set:
      ok: false
      error: Only a superadmin can create or delete organisations.
    then: end
- bad-handle:
    set:
      ok: false
      error: An org handle is 2-24 lowercase letters, digits and dashes, starting and ending with a letter or digit.
    then: end
- reserved:
    set:
      ok: false
      error: That handle is reserved.
    then: end
- taken:
    set:
      ok: false
      error: That handle is taken.
    then: end
- create-find-profile:
    call: lancedb
    with:
      operation: query
      table: profiles
      filter: handle = "${ $context._args.org }"
      limit: 1
      _resource: a3t/a3t-platform-db
    export:
      as: '{_taken_profile: .}'
- create-free:
    switch:
    - taken-by-user:
        when: '${ ($context._taken_profile | length) > 0 }'
        then: taken
    - default:
        then: create-insert
- create-insert:
    call: lancedb
    with:
      operation: insert
      table: orgs
      records:
      - id: '${ "org-" + $context._args.org }'
        name: '${ $context._args.display_name // $context._args.org }'
        slug: '${ $context._args.org }'
        plan: pro
        settings: '{}'
        created_at: '${ now | todate }'
        updated_at: '${ now | todate }'
      _resource: a3t/a3t-platform-db
# The superadmin who creates an org is its first admin.
- creator-admin:
    call: lancedb
    with:
      operation: insert
      table: org_members
      records:
      - id: '${ "org-" + $context._args.org + ":" + $context._me }'
        org_id: '${ "org-" + $context._args.org }'
        user_id: '${ $context._me }'
        email: '${ $context._args.email // "" }'
        name: '${ $context._args.name // "" }'
        role: admin
        added_by: '${ $context._me }'
        created_at: '${ now | todate }'
      _resource: a3t/a3t-platform-db
- created:
    set:
      ok: true
      org: '${ { id: ("org-" + $context._args.org), handle: $context._args.org } }'
    then: end

# ── delete (superadmin; only an org that owns no projects) ──
- delete-check:
    switch:
    - not-super:
        when: '${ $context._super != true }'
        then: need-super
    - missing:
        when: '${ $context._target == null }'
        then: no-org
    - default-org:
        when: '${ $context._target.id == "org-default" }'
        then: keep-default
    - default:
        then: delete-find-projects
- no-org:
    set:
      ok: false
      error: No such organisation.
    then: end
- keep-default:
    set:
      ok: false
      error: The default organisation can't be deleted.
    then: end
- delete-find-projects:
    call: lancedb
    with:
      operation: query
      table: projects
      filter: owner_id = "${ $context._target.id }"
      limit: 1
      _resource: a3t/a3t-platform-db
    export:
      as: '{_owned: .}'
- delete-empty:
    switch:
    - has-projects:
        when: '${ ($context._owned | length) > 0 }'
        then: has-projects
    - default:
        then: delete-members
- has-projects:
    set:
      ok: false
      error: This organisation still owns projects. Move or delete them first.
    then: end
- delete-members:
    call: lancedb
    with:
      operation: delete
      table: org_members
      filter: org_id = "${ $context._target.id }"
      _resource: a3t/a3t-platform-db
- delete-org:
    call: lancedb
    with:
      operation: delete
      table: orgs
      filter: id = "${ $context._target.id }"
      _resource: a3t/a3t-platform-db
- deleted:
    set:
      ok: true
    then: end

# ── members (superadmin or the org's admins) ──
- member-check:
    switch:
    - missing:
        when: '${ $context._target == null }'
        then: no-org
    - not-admin:
        when: '${ (($context._view | map(select(.id == $context._target.id)) | .[0]) // {}).can_identity != true }'
        then: need-admin
    - no-user:
        when: '${ ($context._args.user_id // "") | test("^[A-Za-z0-9@._:-]{1,128}$") | not }'
        then: bad-user
    - bad-role:
        when: '${ $context._args.action == "set_member" and (["member", "admin", "securityadmin"] | index($context._args.role // "") == null) }'
        then: bad-role
    - default:
        then: member-remove-old
- need-admin:
    set:
      ok: false
      error: Managing members needs SuperAdmin, SecurityAdmin, or the org's security admin or admin role (unless the org lets only its security admins change identity).
    then: end
- bad-user:
    set:
      ok: false
      error: Pick a user from the directory.
    then: end
- bad-role:
    set:
      ok: false
      error: A member's role is member, admin or securityadmin.
    then: end
- member-remove-old:
    call: lancedb
    with:
      operation: delete
      table: org_members
      filter: id = "${ $context._target.id + ":" + $context._args.user_id }"
      _resource: a3t/a3t-platform-db
- member-route:
    switch:
    - removing:
        when: '${ $context._args.action == "remove_member" }'
        then: member-done
    - default:
        then: member-insert
- member-insert:
    call: lancedb
    with:
      operation: insert
      table: org_members
      records:
      - id: '${ $context._target.id + ":" + $context._args.user_id }'
        org_id: '${ $context._target.id }'
        user_id: '${ $context._args.user_id }'
        email: '${ $context._args.email // "" }'
        name: '${ $context._args.name // "" }'
        role: '${ $context._args.role }'
        added_by: '${ $context._me }'
        created_at: '${ now | todate }'
      _resource: a3t/a3t-platform-db
- member-done:
    set:
      ok: true
    then: end

# ── org quota (superadmin only: an org can't raise its own) ──
- quota-check:
    switch:
    - missing:
        when: '${ $context._target == null }'
        then: no-org
    - not-super:
        when: '${ (($context._principal.roles // []) | index("SuperAdmin")) == null }'
        then: need-super-quota
    - bad-value:
        when: '${ ($context._args.max_active_runs | type) != "number" or $context._args.max_active_runs < 1 }'
        then: bad-quota
    - default:
        then: quota-write
- need-super-quota:
    set:
      ok: false
      error: Only a platform superadmin can set an org's quota.
    then: end
- bad-quota:
    set:
      ok: false
      error: max_active_runs is a number of at least 1.
    then: end
- quota-write:
    call: lancedb
    with:
      operation: update
      table: orgs
      filter: id = "${ $context._target.id }"
      values:
        settings: '${ ((($context._target.settings // "{}") | fromjson) + { quota: { max_active_runs: $context._args.max_active_runs } }) | tojson }'
        updated_at: '${ now | todate }'
      _resource: a3t/a3t-platform-db
- quota-done:
    set:
      ok: true
      max_active_runs: '${ $context._args.max_active_runs }'
    then: end

# ── runtime policy (superadmin or the org's admins) ──
- runtime-check:
    switch:
    - missing:
        when: '${ $context._target == null }'
        then: no-org
    - not-admin:
        when: '${ (($context._view | map(select(.id == $context._target.id)) | .[0]) // {}).can_admin != true }'
        then: need-admin
    - bad-value:
        when: '${ ["isolated", "shared"] | index($context._args.runtime // "") == null }'
        then: bad-runtime
    - default:
        then: runtime-write
- bad-runtime:
    set:
      ok: false
      error: The runtime policy is isolated or shared.
    then: end
- runtime-write:
    call: lancedb
    with:
      operation: update
      table: orgs
      filter: id = "${ $context._target.id }"
      values:
        settings: '${ ((($context._target.settings // "{}") | fromjson) + { runtime: $context._args.runtime }) | tojson }'
        updated_at: '${ now | todate }'
      _resource: a3t/a3t-platform-db
- runtime-done:
    set:
      ok: true
      runtime: '${ $context._args.runtime }'
    then: end

# ── sign-in per org (superadmin or the org's admins) ──
- sso-check:
    switch:
    - missing:
        when: '${ $context._target == null }'
        then: no-org
    - not-admin:
        when: '${ (($context._view | map(select(.id == $context._target.id)) | .[0]) // {}).can_identity != true }'
        then: need-admin
    - bad-alias:
        when: '${ ($context._args.idp_alias // "") | test("^([a-z0-9][a-z0-9-]{0,38}[a-z0-9])?$") | not }'
        then: bad-alias
    - alias-taken:
        when: '${ ($context._args.idp_alias // "") != "" and ([ $context._orgs[] | select(.id != $context._target.id) | ((.settings // "{}") | if type == "string" then (fromjson? // {}) else (. // {}) end) | (.sso // {}).idp_alias // "" ] | index($context._args.idp_alias) != null) }'
        then: alias-taken
    - bad-domains:
        when: '${ ($context._args.domains // []) | (type != "array") or (map(select(type != "string" or (test("^[a-z0-9.-]+\\.[a-z]{2,}$") | not))) | length > 0) }'
        then: bad-domains
    - mapping-moved:
        when: '${ ($context._args | has("role_map")) or ($context._args | has("default_role")) }'
        then: mapping-moved
    - default:
        then: sso-write
- bad-alias:
    set:
      ok: false
      error: The identity provider alias is lowercase letters, digits and dashes (empty turns sign-in off).
    then: end
- alias-taken:
    set:
      ok: false
      error: Another organisation already signs in through that identity provider.
    then: end
- bad-domains:
    set:
      ok: false
      error: Domains are a list of email domains, like ["acme.com"].
    then: end
- mapping-moved:
    set:
      ok: false
      error: Which groups get which org role is the org's policy file access/org.yaml (Security › the org › Policy files), not a sign-in setting.
    then: end
- sso-write:
    call: lancedb
    with:
      operation: update
      table: orgs
      filter: id = "${ $context._target.id }"
      values:
        settings: >-
          ${ ((($context._target.settings // "{}") | fromjson)
              + { sso: (if ($context._args.idp_alias // "") == "" then null else
                  { idp_alias: $context._args.idp_alias,
                    domains: ($context._args.domains // []) } end) }) | tojson }
        updated_at: '${ now | todate }'
      _resource: a3t/a3t-platform-db
- sso-done:
    set:
      ok: true
    then: end
