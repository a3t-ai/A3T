document:
  dsl: 1.0.3
  namespace: a3t
  name: flow_a3t_agents
  version: 1.1.7
# Request/response for the dash: a run that is interrupted is retried by the
# caller, so it keeps no step journal (spec §5.15).
metadata:
  a3t:
    extends: system/flow_system_base@1.0.0
    durability: transient
do:
- route:
    switch:
    - case:
        when: ${ .input.action == "list" }
        then: list
    - case:
        when: ${ .input.action == "get" }
        then: get
    - case:
        when: ${ .input.action == "create" }
        then: create
    - case:
        when: ${ .input.action == "update" }
        then: update-prep
    - case:
        when: ${ .input.action == "delete" }
        then: delete
    - case:
        when: ${ .input.action == "events" }
        then: list-events
- list:
    call: lancedb
    with:
      operation: query
      table: agent_configs
      filter: org_id = "${ .input.org_id }"
      limit: 100
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: read
          resource:
            type: Agent
    then: only-visible
- get:
    call: lancedb
    with:
      operation: query
      table: agent_configs
      filter: id = "${ .input.id }" AND org_id = "${ .input.org_id }"
      limit: 1
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: read
          resource:
            type: Agent
            id: ${ .input.id }
    then: only-visible
- create:
    set:
      _ag_id: ${ .input.data.id }
      _ag_org: ${ .input.org_id }
      _ag_name: ${ .input.data.name }
      _ag_tpl_id: ${ .input.data.template_id }
      _ag_tpl_ver: ${ .input.data.template_version }
      _ag_mode: ${ .input.data.mode }
      _ag_vars: ${ .input.data.variables }
      _ag_bindings: ${ .input.data.resource_bindings }
      _ag_ns: ${ .input.data.namespace }
      _ag_user: ${ .input.user_id }
      _ag_ts: ${ .input.timestamp }
    export:
      as: "."
    then: create-insert
- create-insert:
    call: lancedb
    with:
      operation: insert
      table: agent_configs
      records:
      - id: ${ $context._ag_id }
        org_id: ${ $context._ag_org }
        name: ${ $context._ag_name }
        template_id: ${ $context._ag_tpl_id }
        template_version: ${ $context._ag_tpl_ver }
        mode: ${ $context._ag_mode }
        variables: ${ $context._ag_vars }
        resource_bindings: ${ $context._ag_bindings }
        namespace: ${ $context._ag_ns }
        status: draft
        created_by: ${ $context._ag_user }
        created_at: ${ $context._ag_ts }
        updated_at: ${ $context._ag_ts }
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: write
          resource:
            type: Agent
    then: log-event-create
- log-event-create:
    call: lancedb
    with:
      operation: insert
      table: agent_events
      records:
      - id: ${ $context._ag_id }-evt-created
        agent_config_id: ${ $context._ag_id }
        event_type: created
        payload: '${ {by: ($context._ag_user // (($context._principal // {}).user // "")), template: (($context._ag_tpl_id // "") + "@" + ($context._ag_tpl_ver // ""))} | tojson }'
        created_at: ${ $context._ag_ts }
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: write
          resource:
            type: Agent
    then: end
# Update: the record as it was, the update, then one event in its history
# (agent_events) naming who changed it and which fields.
- update-prep:
    set:
      _u: ${ .input }
    export:
      as: ${ $context + . }
- update-read:
    call: lancedb
    with:
      operation: query
      table: agent_configs
      filter: id = "${ $context._u.id }"
      limit: 1
      _resource: a3t/a3t-platform-db
    # export sees the output below: the row rides along in it.
    output:
      as: '${ {input: $context._u, old: ((if type == "array" then . else [] end) | .[0] // {})} }'
    export:
      as: '${ $context + {_old: .old} }'
- update:
    call: lancedb
    with:
      operation: update
      table: agent_configs
      filter: id = "${ .input.id }" AND org_id = "${ .input.org_id }"
      values:
        name: ${ .input.data.name // "" }
        template_id: ${ .input.data.template_id // "" }
        template_version: ${ .input.data.template_version // "" }
        mode: ${ .input.data.mode // "" }
        variables: ${ .input.data.variables // "" }
        resource_bindings: ${ .input.data.resource_bindings // "" }
        namespace: ${ .input.data.namespace // "" }
        # Blocking is the control plane's (flow_a3t_agent_control block/unblock): an
        # update neither blocks an agent nor unblocks it.
        status: '${ ((.old // {}).status // "") as $was | (.input.data.status // $was | if . == "" then "draft" else . end) as $new | if $was == "blocked" then "blocked" elif $new == "blocked" then (if $was == "" then "draft" else $was end) else $new end }'
        updated_at: ${ .input.timestamp }
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: write
          resource:
            type: Agent
            id: ${ .input.id }
    then: update-diff
- update-diff:
    set:
      _diff: >-
          ${ ($context._old // {}) as $o
          | (($o.status // "") as $was | (($context._u.data // {}).status // $was | if . == "" then "draft" else . end) as $want
             | if $was == "blocked" then "blocked" elif $want == "blocked" then (if $was == "" then "draft" else $was end) else $want end) as $st
          | (($context._u.data // {}) + {status: $st}) as $n
          | (($o.variables // "{}") | if type == "string" then (try fromjson catch {}) else . end // {}) as $vo
          | (($n.variables // "{}") | if type == "string" then (try fromjson catch {}) else . end // {}) as $vn
          | {by: ((($context._principal // {}).user) // $context._u.user_id // ""),
             changed: (
               (["name", "template_id", "template_version", "mode", "namespace", "status", "resource_bindings"]
                | map(select(($n[.] // null) != null and (($n[.] | tostring) != (($o[.] // "") | tostring)))))
               + ((($vo | keys) + ($vn | keys)) | unique | map(select(($vo[.] // null) != ($vn[.] // null))) | map("values." + .))),
             status: {from: ($o.status // null), to: ($n.status // null)}}
          }
    export:
      as: '${ $context + . }'
# Only a real change goes into its history.
- update-event:
    if: '${ ($context._diff.changed | length) > 0 }'
    try:
      do:
      - update-event-insert:
          call: lancedb
          with:
            operation: insert
            table: agent_events
            records:
            - id: '${ $context._u.id + "-evt-" + ((now * 1000000) | floor | tostring) }'
              agent_config_id: ${ $context._u.id }
              event_type: updated
              payload: '${ $context._diff | tojson }'
              created_at: ${ $context._u.timestamp // (now | todateiso8601) }
            _resource: a3t/a3t-platform-db
    catch:
      do:
      - update-event-failed:
          run:
            workflow:
              namespace: system
              name: flow_system_error_handler
              input:
                error: ${ $context.error }
                flow: a3t/flow_a3t_agents
                version: 1.1.7
                run_id: ${ (($workflow // {}).id // "") | tostring }
                principal: ${ (($context._principal // {}).user // "") | tostring }
                step: update-event
# A save that changed something is also a version (decided 15 Nov 2026), noted
# with what changed. Best effort: the save stands if the version can't be made.
- update-version:
    if: '${ ($context._diff.changed | length) > 0 }'
    try:
    - update-version-make:
        call: registry
        with:
          operation: agent_version
          agent_id: ${ $context._u.id }
          note: '${ "saved: changed " + ($context._diff.changed | map(sub("^values\\."; "")) | join(", ")) }'
    catch:
      do:
      - update-version-failed:
          set:
            _version_error: '${ ($context.error.detail // "no version") | tostring }'
- update-done:
    set:
      updated: true
    output:
      as: '${ {updated: true, id: $context._u.id} }'
    then: end

- delete:
    call: lancedb
    with:
      operation: delete
      table: agent_configs
      filter: id = "${ .input.id }" AND org_id = "${ .input.org_id }"
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: delete
          resource:
            type: Agent
            id: ${ .input.id }
    then: delete-check
# A delete that matched nothing deleted nothing: say so, never "deleted".
- delete-check:
    switch:
    - none:
        when: '${ .deleted == false }'
        then: delete-none
    - default:
        then: end
- delete-none:
    raise:
      error:
        type: https://a3t.io/errors/input
        status: 404
        title: Not found
        detail: No agent with that id in this org (give its id and org_id), so nothing was deleted.
- list-events:
    call: lancedb
    with:
      operation: query
      table: agent_events
      filter: agent_config_id = "${ .input.id }"
      limit: 50
      _resource: a3t/a3t-platform-db
    metadata:
      a3t:
        policy:
          op: read
          resource:
            type: Agent
            id: ${ .input.id }
    then: end
# Only the agents the caller may see: their projects' (and, for users' agents
# from before projects, org default's). Both list and get end here.
- only-visible:
    call: registry
    with:
      operation: visible
      kind: agent
      items: ${ . }
    then: end
