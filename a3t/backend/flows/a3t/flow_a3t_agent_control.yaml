document:
  dsl: '1.0.3'
  namespace: a3t
  name: flow_a3t_agent_control
  version: '1.3.1'
  metadata:
    description: >
      The agents control plane. One flow, one action per call (input.action):
      create (from a template or an agent; mode template | inherit | clone), get
      (record, relation, endpoints, shares; create also registers its memory space and
      makes its first key — returned once, as key.key —
      forget removes it), lineage (ancestors and descendants),
      relate (record where an agent came from, e.g. after POST /agents/{id}/fork),
      compare (can a fork merge back?), merge (a fork's procedures into its source,
      through ADB), evolve (a fork that can't merge becomes its own agent), shares,
      share, unshare, shared_with (agents shared with a namespace, and public ones),
      block and unblock (its data plane refuses calls while blocked), turns and
      memory (its own figures). Changes (share, unshare, block, unblock) are
      written to its history (agent_events).
      Memory copies with history (fork, branch, promote) stay FlowR's REST routes
      under /agents/{id}; this flow records the relation. See
      .ai/A3T_AGENTS_API_PLAN.md.
      Input: { action, org_id, user_id?, ... }. Output: { ok, ... }.

metadata:
  a3t:
    extends: system/flow_system_base@1.0.0
    durability: transient

do:
  - setup:
      set:
        _in: '${ . }'
        _org: '${ .org_id // "org-default" }'
        _who: '${ .user_id // (($context._principal // {}).user // "") | tostring }'
        _now: '${ now | todateiso8601 }'
      export:
        as: '${ $context + . }'

  - route:
      switch:
        - create: { when: '${ $context._in.action == "create" }', then: create }
        - get: { when: '${ $context._in.action == "get" }', then: get }
        - lineage: { when: '${ $context._in.action == "lineage" }', then: lineage }
        - relate: { when: '${ $context._in.action == "relate" }', then: relate }
        - compare: { when: '${ $context._in.action == "compare" or $context._in.action == "merge" }', then: compare }
        - evolve: { when: '${ $context._in.action == "evolve" }', then: evolve }
        - shares: { when: '${ $context._in.action == "shares" }', then: shares }
        - share: { when: '${ $context._in.action == "share" }', then: share }
        - unshare: { when: '${ $context._in.action == "unshare" }', then: unshare }
        - shared_with: { when: '${ $context._in.action == "shared_with" }', then: shared_with }
        - forget: { when: '${ $context._in.action == "forget" }', then: forget }
        - turns: { when: '${ $context._in.action == "turns" }', then: turns }
        - memory: { when: '${ $context._in.action == "memory" }', then: memory_space }
        - block: { when: '${ $context._in.action == "block" or $context._in.action == "unblock" }', then: block }
        - unknown: { then: unknown }

  - unknown:
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 400
          title: Unknown action
          detail: '${ "flow_a3t_agent_control: unknown action " + (($context._in.action // "none") | tostring) + ". Use create, get, lineage, relate, compare, merge, evolve, shares, share, unshare, shared_with, forget, turns, memory, block or unblock." }'

  # ═══ create ════════════════════════════════════════════════════════════════
  # { action: create, from: {kind: template|agent, id, version?}, mode?: template | inherit|clone|fork,
  #   name, project?, values?: {system_prompt, llm_resource, mcp_servers, enabled_tools, ...},
  #   agent_mode?: persistent|ephemeral|reactive, id? }
  - create:
      set:
        _from: '${ $context._in.from // {} }'
        _id: '${ $context._in.id // ("agt-" + ((now * 1000000 | floor) | tostring)) }'
        _rel: '${ $context._in.mode // (if (($context._in.from // {}).kind // "") == "template" then "template" else "inherit" end) }'
      export:
        as: '${ $context + . }'
  - create_check:
      if: '${ ($context._from.kind // "") as $k | ($k != "template" and $k != "agent") or (($context._from.id // "") == "") or (($context._in.name // "") == "") or (if $context._from.kind == "agent" then ["inherit", "clone", "fork"] else ["template"] end | index($context._rel)) == null }'
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 400
          title: Can't create the agent
          detail: 'create needs from: {kind: template | agent, id}, a name, and a mode: template (from a template), or inherit | clone | fork (from an agent). To carry its memory, branch it (POST /agents/{id}/branches) and promote the branch.'
  - create_source_template:
      if: '${ $context._from.kind == "template" }'
      call: lancedb
      with:
        operation: query
        table: template_registry
        filter: '${ "id = ''" + $context._from.id + "''" }'
        limit: 1
        _resource: a3t/a3t-platform-db
      export:
        as: '${ $context + {_src: ((if type == "array" then . else (.rows // .data // []) end) | .[0] // null)} }'
  - create_source_agent:
      if: '${ $context._from.kind == "agent" }'
      call: lancedb
      with:
        operation: query
        table: agent_configs
        filter: '${ "id = ''" + $context._from.id + "''" }'
        limit: 1
        _resource: a3t/a3t-platform-db
      export:
        as: '${ $context + {_src: ((if type == "array" then . else (.rows // .data // []) end) | .[0] // null)} }'
  - create_found:
      if: '${ $context._src == null }'
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 404
          title: Source not found
          detail: '${ "No " + $context._from.kind + " " + $context._from.id + " in this org." }'
  - create_exists:
      call: lancedb
      with:
        operation: query
        table: agent_configs
        filter: '${ "id = ''" + $context._id + "''" }'
        limit: 1
        _resource: a3t/a3t-platform-db
      export:
        as: '${ $context + {_exists: (((if type == "array" then . else (.rows // .data // []) end) | length) > 0)} }'
  - create_unique:
      if: '${ $context._exists }'
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 409
          title: Agent exists
          detail: '${ "An agent with id " + $context._id + " already exists." }'
  - create_row:
      set:
        _row: >-
          ${ ($context._src) as $s
          | (if $context._from.kind == "agent" then (($s.variables // "{}") | try fromjson catch {} | del(.memory_namespace)) else {} end) as $base
          | {
              id: $context._id,
              org_id: $context._org,
              name: $context._in.name,
              template_id: (if $context._from.kind == "template" then $s.id else ($s.template_id // "") end),
              template_version: (($context._from.version // (if $context._from.kind == "template" then $s.version else $s.template_version end)) // "" | tostring),
              mode: ($context._in.agent_mode // (if $context._from.kind == "agent" then $s.mode else null end) // "persistent"),
              variables: ($base * ($context._in.values // {}) | tojson),
              resource_bindings: (if $context._from.kind == "agent" then ($s.resource_bindings // "{}") else (($context._in.resource_bindings // {}) | tojson) end),
              namespace: ($context._in.project // (if $context._from.kind == "agent" then $s.namespace else null end) // "default"),
              status: "draft",
              created_by: $context._who,
              created_at: $context._now,
              updated_at: $context._now
            } }
      export:
        as: '${ $context + . }'
  - create_insert:
      call: lancedb
      with:
        operation: insert
        table: agent_configs
        records:
          - '${ $context._row }'
        _resource: a3t/a3t-platform-db
      metadata:
        a3t:
          policy:
            op: write
            resource:
              type: Agent
  - create_relation:
      call: lancedb
      with:
        operation: insert
        table: agent_relations
        records:
          - id: '${ "rel-" + $context._id }'
            agent_id: '${ $context._id }'
            parent_kind: '${ $context._from.kind }'
            parent_id: '${ $context._from.id }'
            parent_version: '${ $context._row.template_version }'
            relation: '${ $context._rel }'
            created_by: '${ $context._who }'
            created_at: '${ $context._now }'
            updated_at: '${ $context._now }'
        _resource: a3t/a3t-platform-db
  - create_event:
      call: lancedb
      with:
        operation: insert
        table: agent_events
        records:
          - id: '${ $context._id + "-evt-created" }'
            agent_config_id: '${ $context._id }'
            event_type: created
            payload: '${ {by: $context._who, from: $context._from, relation: $context._rel} | tojson }'
            created_at: '${ $context._now }'
        _resource: a3t/a3t-platform-db
  # Its memory space: the namespace the core keeps its memory in (its id), on the
  # org's ADB. Registered here, FlowR's versions and memory branches work on it
  # (/agents/{id}/versions, /branches). A failure is reported, not fatal.
  - create_space:
      try:
        do:
          - space_insert:
              call: lancedb
              with:
                operation: insert
                table: agent_memory
                records:
                  - agent_id: '${ $context._id }'
                    org_id: '${ $context._org }'
                    namespace: '${ $context._id }'
                    updated_by: '${ $context._who }'
                    updated_at: '${ $context._now }'
                _resource: a3t/a3t-platform-db
      catch:
        do:
          - space_failed:
              run:
                workflow:
                  namespace: system
                  name: flow_system_error_handler
                  input:
                    error: '${ $context.error }'
                    flow: a3t/flow_a3t_agent_control
                    version: 1.3.1
                    run_id: '${ (($workflow // {}).id // "") | tostring }'
                    principal: '${ $context._who }'
                    step: create_space
  # Its first key: every call to its data plane needs a token, so it is made with
  # one ("default"). The key is in this answer only; FlowR keeps its hash.
  - create_key:
      try:
        do:
          - key_make:
              call: registry
              with:
                operation: agent_key
                agent_id: '${ $context._id }'
                name: default
              export:
                as: '${ $context + {_key: .} }'
      catch:
        do:
          - key_failed:
              run:
                workflow:
                  namespace: system
                  name: flow_system_error_handler
                  input:
                    error: '${ $context.error }'
                    flow: a3t/flow_a3t_agent_control
                    version: 1.3.1
                    run_id: '${ (($workflow // {}).id // "") | tostring }'
                    principal: '${ $context._who }'
                    step: create_key
              export:
                as: '${ $context + {_key: null} }'
  - create_done:
      set:
        ok: true
        key: '${ $context._key }'
        agent: '${ $context._row | del(.variables, .resource_bindings) }'
        relation: '${ {kind: $context._rel, parent: $context._from} }'
        endpoints: >-
          ${ {
              control: ("/agents/" + $context._id),
              data: {chat: "/chat", session_id: ($context._id + ":<session>"), stream: "/chat/stream/<session_id>"}
            } }
      then: end

  # ═══ get ═══════════════════════════════════════════════════════════════════
  # { action: get, id }
  - get:
      call: lancedb
      with:
        operation: query
        table: agent_configs
        filter: '${ "id = ''" + ($context._in.id // "") + "''" }'
        limit: 1
        _resource: a3t/a3t-platform-db
      export:
        as: '${ $context + {_row: ((if type == "array" then . else (.rows // .data // []) end) | .[0] // null)} }'
      metadata:
        a3t:
          policy:
            op: read
            resource:
              type: Agent
              id: '${ $context._in.id }'
  - get_found:
      if: '${ $context._row == null }'
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 404
          title: Agent not found
          detail: '${ "No agent " + ($context._in.id // "") + "." }'
  - get_relation:
      call: lancedb
      with:
        operation: query
        table: agent_relations
        filter: '${ "agent_id = ''" + $context._in.id + "''" }'
        limit: 1
        _resource: a3t/a3t-platform-db
      export:
        as: '${ $context + {_relrow: ((if type == "array" then . else (.rows // .data // []) end) | .[0] // null)} }'
  - get_shares:
      call: lancedb
      with:
        operation: query
        table: agent_shares
        filter: '${ "agent_id = ''" + $context._in.id + "''" }'
        limit: 200
        _resource: a3t/a3t-platform-db
      export:
        as: '${ $context + {_shares: (if type == "array" then . else (.rows // .data // []) end)} }'
  - get_done:
      set:
        ok: true
        agent: '${ $context._row + {variables: (($context._row.variables // "{}") | try fromjson catch {}), resource_bindings: (($context._row.resource_bindings // "{}") | try fromjson catch {})} }'
        relation: '${ if $context._relrow == null then null else {kind: $context._relrow.relation, parent: {kind: $context._relrow.parent_kind, id: $context._relrow.parent_id, version: $context._relrow.parent_version}} end }'
        visibility: '${ if ($context._shares | map(.target) | index("*")) != null then "public" elif ($context._shares | length) > 0 then "namespaces" else "private" end }'
        shares: '${ $context._shares }'
        endpoints: >-
          ${ {
              control: ("/agents/" + $context._in.id),
              memory: ("/agents/" + $context._in.id + "/memory"),
              data: {chat: "/chat", session_id: ($context._in.id + ":<session>"), stream: "/chat/stream/<session_id>"}
            } }
      then: end

  # ═══ lineage ═══════════════════════════════════════════════════════════════
  # { action: lineage, id }. Ancestors up to 5 levels, and direct descendants.
  - lineage:
      set:
        _up: []
        _cur: '${ $context._in.id // "" }'
      export:
        as: '${ $context + . }'
  - lineage_up:
      for:
        each: _step
        in: '${ [1, 2, 3, 4, 5] }'
        do:
          - up_one:
              if: '${ $context._cur != "" }'
              call: lancedb
              with:
                operation: query
                table: agent_relations
                filter: '${ "agent_id = ''" + $context._cur + "''" }'
                limit: 1
                _resource: a3t/a3t-platform-db
              export:
                as: >-
                  ${ ((if type == "array" then . else (.rows // .data // []) end) | .[0] // null) as $r
                  | if $r == null then $context + {_cur: ""}
                    else $context + {
                      _up: ($context._up + [{kind: $r.parent_kind, id: $r.parent_id, version: $r.parent_version, relation: $r.relation}]),
                      _cur: (if $r.parent_kind == "agent" then $r.parent_id else "" end)
                    } end }
  - lineage_down:
      call: lancedb
      with:
        operation: query
        table: agent_relations
        filter: '${ "parent_id = ''" + ($context._in.id // "") + "''" }'
        limit: 200
        _resource: a3t/a3t-platform-db
      export:
        as: '${ $context + {_down: ((if type == "array" then . else (.rows // .data // []) end) | map({id: .agent_id, relation: .relation, since: .created_at}))} }'
  - lineage_done:
      set:
        ok: true
        id: '${ $context._in.id }'
        ancestors: '${ $context._up }'
        descendants: '${ $context._down }'
      then: end

  # ═══ relate ════════════════════════════════════════════════════════════════
  # { action: relate, id, parent: {kind: agent|template, id, version?}, relation: fork|branch|clone|inherit|template }
  # For agents FlowR made (POST /agents/{id}/fork, branch promote): record where they came from.
  - relate:
      if: '${ ((["fork", "branch", "clone", "inherit", "template"] | index($context._in.relation // "")) == null) or (($context._in.id // "") == "") or ((($context._in.parent // {}).id // "") == "") }'
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 400
          title: Can't record the relation
          detail: 'relate needs id, parent: {kind, id} and relation fork | branch | clone | inherit | template.'
  # An agent has one relation: recording it again replaces the old one.
  - relate_replace:
      call: lancedb
      with:
        operation: delete
        table: agent_relations
        filter: '${ "id = ''rel-" + $context._in.id + "''" }'
        _resource: a3t/a3t-platform-db
      metadata:
        a3t:
          policy:
            op: write
            resource:
              type: Agent
              id: '${ $context._in.id }'
  - relate_insert:
      call: lancedb
      with:
        operation: insert
        table: agent_relations
        records:
          - id: '${ "rel-" + $context._in.id }'
            agent_id: '${ $context._in.id }'
            parent_kind: '${ $context._in.parent.kind // "agent" }'
            parent_id: '${ $context._in.parent.id }'
            parent_version: '${ ($context._in.parent.version // "") | tostring }'
            relation: '${ $context._in.relation }'
            created_by: '${ $context._who }'
            created_at: '${ $context._now }'
            updated_at: '${ $context._now }'
        _resource: a3t/a3t-platform-db
      metadata:
        a3t:
          policy:
            op: write
            resource:
              type: Agent
              id: '${ $context._in.id }'
  - relate_done:
      set:
        ok: true
        id: '${ $context._in.id }'
        relation: '${ $context._in.relation }'
      then: end

  # ═══ compare / merge ═══════════════════════════════════════════════════════
  # { action: compare | merge, id (the fork) }. A fork can merge back when only its
  # procedural memory differs: same template, version, instructions, model, tools.
  # merge then copies its procedures into the source's memory through ADB, which
  # sequences each write; episodes and facts stay with the fork.
  - compare:
      call: lancedb
      with:
        operation: query
        table: agent_relations
        filter: '${ "agent_id = ''" + ($context._in.id // "") + "''" }'
        limit: 1
        _resource: a3t/a3t-platform-db
      export:
        as: '${ $context + {_relrow: ((if type == "array" then . else (.rows // .data // []) end) | .[0] // null)} }'
  - compare_has_parent:
      if: '${ $context._relrow == null or $context._relrow.parent_kind != "agent" }'
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 409
          title: Nothing to merge into
          detail: '${ ($context._in.id // "") + " was not made from another agent, so it has nothing to merge back into." }'
  - compare_rows:
      call: lancedb
      with:
        operation: query
        table: agent_configs
        filter: '${ "id = ''" + $context._in.id + "'' OR id = ''" + $context._relrow.parent_id + "''" }'
        limit: 2
        _resource: a3t/a3t-platform-db
      export:
        as: >-
          ${ (if type == "array" then . else (.rows // .data // []) end) as $r
          | $context + {
              _mine: ($r | map(select(.id == $context._in.id)) | .[0] // null),
              _theirs: ($r | map(select(.id == $context._relrow.parent_id)) | .[0] // null)
            } }
  - compare_diff:
      set:
        _changed: >-
          ${ def vars: ((.variables // "{}") | try fromjson catch {});
          ($context._mine // {}) as $a | ($context._theirs // {}) as $b
          | ($a | vars) as $va | ($b | vars) as $vb
          | (["template_id", "template_version", "mode"] | map(select(($a[.] // "") != ($b[.] // ""))))
            + ((($va | keys) + ($vb | keys)) | unique | map(select(. != "memory_namespace")) | map(select(($va[.] // null) != ($vb[.] // null))) | map("values." + .)) }
        _src_ns: '${ (($context._theirs // {}).namespace // "default") + "--" + $context._relrow.parent_id }'
        _fork_ns: '${ (($context._mine // {}).namespace // "default") + "--" + $context._in.id }'
      export:
        as: '${ $context + . }'
  - compare_done:
      if: '${ $context._in.action == "compare" }'
      set:
        ok: true
        id: '${ $context._in.id }'
        source: '${ $context._relrow.parent_id }'
        mergeable: '${ ($context._changed | length) == 0 }'
        changed: '${ $context._changed }'
        carries: procedural
        next: '${ if ($context._changed | length) == 0 then "merge" else "evolve" end }'
      then: end
  - merge_check:
      if: '${ ($context._changed | length) > 0 }'
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 409
          title: Can't merge
          detail: '${ "Only a fork whose procedures alone changed can merge back. Changed: " + ($context._changed | join(", ")) + ". Evolve it into its own agent instead." }'
  - merge_read:
      call: adb
      with:
        query: '${ "RECALL FROM PROCEDURAL ALL NAMESPACE \"" + $context._fork_ns + "\" LIMIT 1000" }'
        _resource: '${ $context._in.memory_resource // "a3t/adb" }'
      export:
        as: '${ $context + {_procs: ((.data.records // .data.data.records // .records // []) | map(.data) | map(select((.kind // "") != "tool")) | map(del(.pattern_id, .severity, .confidence, .source, .success_count, .failure_count, .variables, .metadata, .version))), merged: 0, merge_failed: []} }'
  - merge_write:
      for:
        each: _p
        in: '${ $context._procs }'
        do:
          - merge_one:
              try:
                do:
                  - store_proc:
                      call: adb
                      with:
                        query: >-
                          ${ def q: "\"" + (if type == "string" then . else tojson end | gsub("\\\\"; "\\\\") | gsub("\""; "\\\"")) + "\""; def v: if type == "array" then "[" + (map(q) | join(", ")) + "]" else q end;
                          "STORE INTO PROCEDURAL (" + ($_p | to_entries | map(select(.value != null)) | map(.key + " = " + (.value | v)) | join(", "))
                          + ") NAMESPACE " + ($context._src_ns | q) }
                        _resource: '${ $context._in.memory_resource // "a3t/adb" }'
                      export:
                        as: '${ $context + {merged: ($context.merged + 1)} }'
                catch:
                  do:
                    - update_proc:
                        if: '${ (($context.error.detail // "") + ($context.error.title // "")) | test("key_exists") }'
                        try:
                          do:
                            - update_one:
                                call: adb
                                with:
                                  query: >-
                                    ${ def q: "\"" + (if type == "string" then . else tojson end | gsub("\\\\"; "\\\\") | gsub("\""; "\\\"")) + "\""; def v: if type == "array" then "[" + (map(q) | join(", ")) + "]" else q end;
                                    "UPDATE INTO PROCEDURAL WHERE key = " + ($_p.key | q) + " ("
                                    + ($_p | to_entries | map(select(.key != "key" and .value != null)) | map(.key + " = " + (.value | v)) | join(", "))
                                    + ") NAMESPACE " + ($context._src_ns | q) }
                                  _resource: '${ $context._in.memory_resource // "a3t/adb" }'
                                export:
                                  as: '${ $context + {merged: ($context.merged + 1)} }'
                          catch:
                            do:
                              - update_failed:
                                  set:
                                    merge_failed: '${ $context.merge_failed + [{key: ($_p.key // ""), error: ($context.error.detail // $context.error.title // "update failed")}] }'
                                  export:
                                    as: '${ $context + . }'
                    - store_failed:
                        if: '${ ((($context.error.detail // "") + ($context.error.title // "")) | test("key_exists")) | not }'
                        set:
                          merge_failed: '${ $context.merge_failed + [{key: ($_p.key // ""), error: ($context.error.detail // $context.error.title // "store failed")}] }'
                        export:
                          as: '${ $context + . }'
  - merge_event:
      call: lancedb
      with:
        operation: insert
        table: agent_events
        records:
          - id: '${ $context._relrow.parent_id + "-evt-merge-" + $context._in.id + "-" + ((now * 1000 | floor) | tostring) }'
            agent_config_id: '${ $context._relrow.parent_id }'
            event_type: merged
            payload: '${ {by: $context._who, from: $context._in.id, procedures: $context.merged, failed: ($context.merge_failed | length)} | tojson }'
            created_at: '${ $context._now }'
        _resource: a3t/a3t-platform-db
  - merge_done:
      set:
        ok: '${ ($context.merge_failed | length) == 0 }'
        id: '${ $context._in.id }'
        into: '${ $context._relrow.parent_id }'
        procedures: '${ $context.merged }'
        failed: '${ $context.merge_failed }'
      then: end

  # ═══ evolve ════════════════════════════════════════════════════════════════
  # { action: evolve, id }. The fork keeps its parent as ancestor, as relation "evolved".
  - evolve:
      call: lancedb
      with:
        operation: update
        table: agent_relations
        filter: '${ "agent_id = ''" + ($context._in.id // "") + "''" }'
        values:
          relation: evolved
          updated_at: '${ $context._now }'
        _resource: a3t/a3t-platform-db
      metadata:
        a3t:
          policy:
            op: write
            resource:
              type: Agent
              id: '${ $context._in.id }'
  - evolve_done:
      set:
        ok: true
        id: '${ $context._in.id }'
        relation: evolved
      then: end

  # ═══ sharing ═══════════════════════════════════════════════════════════════
  # shares { id } · share { id, target: <namespace> | "*", rights?: {call, inherit, fork, merge_back} }
  # unshare { id, target } · shared_with { namespace }: agents shared with it, and public ones.
  - shares:
      call: lancedb
      with:
        operation: query
        table: agent_shares
        filter: '${ "agent_id = ''" + ($context._in.id // "") + "''" }'
        limit: 200
        _resource: a3t/a3t-platform-db
      output:
        as: '${ {ok: true, id: $context._in.id, shares: (if type == "array" then . else (.rows // .data // []) end)} }'
      then: end

  - share:
      if: '${ (($context._in.id // "") == "") or (($context._in.target // "") == "") }'
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 400
          title: Can't share
          detail: 'share needs id and target: a namespace, or "*" for public.'
  - share_replace:
      call: lancedb
      with:
        operation: delete
        table: agent_shares
        filter: '${ "id = ''" + "shr-" + $context._in.id + "-" + $context._in.target + "''" }'
        _resource: a3t/a3t-platform-db
      metadata:
        a3t:
          policy:
            op: write
            resource:
              type: Agent
              id: '${ $context._in.id }'
  - share_insert:
      call: lancedb
      with:
        operation: insert
        table: agent_shares
        records:
          - id: '${ "shr-" + $context._in.id + "-" + $context._in.target }'
            agent_id: '${ $context._in.id }'
            target: '${ $context._in.target }'
            can_call: '${ (($context._in.rights // {}).call // true) | tostring }'
            can_inherit: '${ (($context._in.rights // {}).inherit // false) | tostring }'
            can_fork: '${ (($context._in.rights // {}).fork // false) | tostring }'
            can_merge_back: '${ (($context._in.rights // {}).merge_back // false) | tostring }'
            granted_by: '${ $context._who }'
            granted_at: '${ $context._now }'
        _resource: a3t/a3t-platform-db
  - share_done:
      set:
        _out: '${ {ok: true, id: $context._in.id, target: $context._in.target} }'
        _ev: '${ {type: "shared", payload: {target: $context._in.target, rights: ($context._in.rights // {call: true})}} }'
      export:
        as: '${ $context + . }'
      then: note_event

  - unshare:
      call: lancedb
      with:
        operation: delete
        table: agent_shares
        filter: '${ "id = ''" + "shr-" + ($context._in.id // "") + "-" + ($context._in.target // "") + "''" }'
        _resource: a3t/a3t-platform-db
      metadata:
        a3t:
          policy:
            op: write
            resource:
              type: Agent
              id: '${ $context._in.id }'
  - unshare_done:
      set:
        _out: '${ {ok: true, id: $context._in.id, target: $context._in.target} }'
        _ev: '${ {type: "unshared", payload: {target: $context._in.target}} }'
      export:
        as: '${ $context + . }'
      then: note_event

  - shared_with:
      call: lancedb
      with:
        operation: query
        table: agent_shares
        filter: '${ "target = ''" + ($context._in.namespace // "") + "'' OR target = ''*''" }'
        limit: 500
        _resource: a3t/a3t-platform-db
      output:
        as: '${ {ok: true, namespace: $context._in.namespace, shares: (if type == "array" then . else (.rows // .data // []) end)} }'
      then: end

  # ═══ forget ════════════════════════════════════════════════════════════════
  # { action: forget, id }. After an agent is deleted: its relation and its shares.
  - forget:
      call: lancedb
      with:
        operation: delete
        table: agent_relations
        filter: '${ "agent_id = ''" + ($context._in.id // "") + "''" }'
        _resource: a3t/a3t-platform-db
      metadata:
        a3t:
          policy:
            op: delete
            resource:
              type: Agent
              id: '${ $context._in.id }'
  - forget_shares:
      call: lancedb
      with:
        operation: delete
        table: agent_shares
        filter: '${ "agent_id = ''" + ($context._in.id // "") + "''" }'
        _resource: a3t/a3t-platform-db
  - forget_space:
      try:
        do:
          - space_delete:
              call: lancedb
              with:
                operation: delete
                table: agent_memory
                filter: '${ "agent_id = ''" + ($context._in.id // "") + "''" }'
                _resource: a3t/a3t-platform-db
      catch:
        do:
          - no_space_row:
              set:
                _none: true
  - forget_done:
      set:
        ok: true
        id: '${ $context._in.id }'
      then: end

  # ═══ turns ═════════════════════════════════════════════════════════════════
  # { action: turns, id, limit? }. The agent's own figures, from the core's turn log
  # (a3t_agent_turns): its latest turns and a summary of them.
  - turns:
      call: lancedb
      with:
        operation: query
        table: a3t_agent_turns
        filter: '${ "agent_id = ''" + ($context._in.id // "") + "''" }'
        limit: '${ $context._in.limit // 200 }'
        _resource: a3t/a3t-platform-db
      metadata:
        a3t:
          policy:
            op: read
            resource:
              type: Agent
              id: '${ $context._in.id }'
      output:
        as: >-
          ${ (if type == "array" then . else (.rows // .data // []) end | sort_by(.at) | reverse) as $t
          | ($t | map((.duration_ms // "0") | tonumber)) as $ms
          | {
              ok: true,
              id: $context._in.id,
              summary: {
                turns: ($t | length),
                failed: ($t | map(select((.outcome // "") != "answered" and (.outcome // "") != "" and (.outcome // "") != "null")) | length),
                degraded: ($t | map(select((.degraded // "") != "")) | length),
                tool_calls: ($t | map((.tool_calls // "0") | tonumber) | add // 0),
                avg_ms: (if ($ms | length) > 0 then (($ms | add) / ($ms | length) | floor) else 0 end),
                last_at: (($t[0] // {}).at // null)
              },
              turns: ($t | .[0:50])
            } }
      then: end

  # ═══ memory ════════════════════════════════════════════════════════════════
  # { action: memory, id, namespace?, limit? }. What the agent remembers, by memory
  # type, from its own namespace on the org ADB (the core keeps it under the agent's id).
  - memory_space:
      try:
        do:
          - space_row:
              call: lancedb
              with:
                operation: query
                table: agent_memory
                filter: '${ "agent_id = ''" + ($context._in.id // "") + "''" }'
                limit: 1
                _resource: a3t/a3t-platform-db
              export:
                as: '${ $context + {_space: ((if type == "array" then . else [] end) | .[0] // {} | .namespace // null)} }'
      catch:
        do:
          - no_space:
              set:
                _space: null
              export:
                as: '${ $context + . }'
  - memory:
      set:
        _ns: '${ $context._in.namespace // $context._space // $context._in.id // "" }'
        _lim: '${ $context._in.limit // 100 }'
        _mem: {}
      export:
        as: '${ $context + . }'
  - memory_read:
      for:
        each: _type
        in: '${ ["WORKING", "EPISODIC", "SEMANTIC", "PROCEDURAL"] }'
        do:
          - one_type:
              try:
                do:
                  - recall:
                      call: adb
                      with:
                        query: '${ "RECALL FROM " + $_type + " ALL NAMESPACE \"" + $context._ns + "\" LIMIT " + ($context._lim | tostring) }'
                        _resource: '${ $context._in.memory_resource // "a3t/adb" }'
                      export:
                        # Each entry with its key and when it was stored, newest first.
                        as: >-
                          ${ $context + {_mem: ($context._mem + {($_type | ascii_downcase):
                             ((.data.records // .data.data.records // .records // [])
                              | map({key: (.key // .data.key // null), at: (.metadata.created_at // .created_at // null), data: (.data // {})})
                              | sort_by(.at // "") | reverse)})} }
                catch:
                  do:
                    - none:
                        set:
                          _mem: '${ $context._mem + {($_type | ascii_downcase): []} }'
                        export:
                          as: '${ $context + . }'
  - memory_done:
      set:
        ok: true
        id: '${ $context._in.id }'
        namespace: '${ $context._ns }'
        counts: '${ $context._mem | with_entries(.value |= length) }'
        memory: '${ $context._mem }'
      then: end

  # ═══ block / unblock ═══════════════════════════════════════════════════════
  # { action: block | unblock, id, reason? }. Blocked, its data plane
  # (a3t/tmpl_a3t_agent: POST /chat, its webhook) refuses every call; its record,
  # memory and control plane stay. Unblocking gives back the status it had.
  - block:
      if: '${ ($context._in.id // "") == "" }'
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 400
          title: Can't block
          detail: 'block and unblock need the agent''s id.'
  - block_read:
      call: lancedb
      with:
        operation: query
        table: agent_configs
        filter: '${ "id = ''" + $context._in.id + "''" }'
        limit: 1
        _resource: a3t/a3t-platform-db
      metadata:
        a3t:
          policy:
            op: write
            resource:
              type: Agent
              id: '${ $context._in.id }'
      export:
        as: '${ $context + {_row: ((if type == "array" then . else [] end) | .[0] // null)} }'
  - block_found:
      if: '${ $context._row == null }'
      raise:
        error:
          type: https://a3t.io/errors/input
          status: 404
          title: No such agent
          detail: '${ "There is no agent " + $context._in.id + "." }'
  - block_prev:
      call: lancedb
      with:
        operation: query
        table: agent_events
        filter: '${ "agent_config_id = ''" + $context._in.id + "'' AND event_type = ''blocked''" }'
        limit: 200
        _resource: a3t/a3t-platform-db
      export:
        as: >-
          ${ $context + {_prev: ((if type == "array" then . else [] end) | sort_by(.created_at) | reverse
             | map((.payload // "{}") | try fromjson catch {}) | map(.prev // null) | map(select(. != null and . != "blocked")) | .[0] // "live")} }
  - block_set:
      call: lancedb
      with:
        operation: update
        table: agent_configs
        filter: '${ "id = ''" + $context._in.id + "''" }'
        values:
          status: '${ if $context._in.action == "block" then "blocked" elif $context._row.status == "blocked" then $context._prev else $context._row.status end }'
          updated_at: '${ $context._now }'
        _resource: a3t/a3t-platform-db
  - block_done:
      set:
        _out: >-
          ${ {ok: true, id: $context._in.id,
              status: (if $context._in.action == "block" then "blocked" elif $context._row.status == "blocked" then $context._prev else $context._row.status end)} }
        _ev: >-
          ${ {type: (if $context._in.action == "block" then "blocked" else "unblocked" end),
              payload: ({prev: $context._row.status} + (if $context._in.reason then {reason: $context._in.reason} else {} end))} }
      export:
        as: '${ $context + . }'
      then: note_event

  # ═══ its history ═══════════════════════════════════════════════════════════
  # The change in _ev ({type, payload}) goes to agent_events; the action's answer
  # is _out. A failed write is reported and never fails the action.
  - note_event:
      try:
        do:
          - note_insert:
              call: lancedb
              with:
                operation: insert
                table: agent_events
                records:
                  - id: '${ $context._in.id + "-evt-" + ((now * 1000000) | floor | tostring) }'
                    agent_config_id: '${ $context._in.id }'
                    event_type: '${ $context._ev.type }'
                    payload: '${ ($context._ev.payload // {}) + {by: $context._who} | tojson }'
                    created_at: '${ $context._now }'
                _resource: a3t/a3t-platform-db
      catch:
        do:
          - note_failed:
              run:
                workflow:
                  namespace: system
                  name: flow_system_error_handler
                  input:
                    error: '${ $context.error }'
                    flow: a3t/flow_a3t_agent_control
                    version: 1.3.1
                    run_id: '${ (($workflow // {}).id // "") | tostring }'
                    principal: '${ $context._who }'
                    step: note_event
  - note_done:
      set:
        done: true
      output:
        as: '${ $context._out }'
      then: end
