<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" font-family="Inter, system-ui, sans-serif" font-size="15">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker></defs>
  <rect width="720" height="640" rx="14" fill="#faf8f4"/>
  <!-- callers -->
  <g fill="#fff" stroke="#c9c2b6"><rect x="20" y="20" width="160" height="62" rx="10"/><rect x="195" y="20" width="160" height="62" rx="10"/><rect x="370" y="20" width="160" height="62" rx="10"/><rect x="545" y="20" width="155" height="62" rx="10"/></g>
  <g text-anchor="middle"><text x="100" y="46" font-weight="600" fill="#1c1917">Your apps</text><text x="100" y="68" font-size="13" fill="#57534e">call agents with a key</text>
  <text x="275" y="46" font-weight="600" fill="#1c1917">Console</text><text x="275" y="68" font-size="13" fill="#57534e">build and govern</text>
  <text x="450" y="46" font-weight="600" fill="#1c1917">VS Code + Claude</text><text x="450" y="68" font-size="13" fill="#57534e">developers, over MCP</text>
  <text x="622" y="46" font-weight="600" fill="#1c1917">Keycloak</text><text x="622" y="68" font-size="13" fill="#57534e">sign-in, your IdP</text></g>
  <!-- FlowR -->
  <rect x="20" y="130" width="510" height="210" rx="12" fill="#eef4f1" stroke="#1a7158"/>
  <text x="38" y="158" font-weight="700" font-size="16" fill="#1a7158">FlowR — the A3T server</text>
  <g fill="#fff" stroke="#9cc3b5"><rect x="36" y="174" width="155" height="70" rx="8"/><rect x="198" y="174" width="155" height="70" rx="8"/><rect x="360" y="174" width="155" height="70" rx="8"/><rect x="36" y="254" width="155" height="70" rx="8"/><rect x="198" y="254" width="155" height="70" rx="8"/><rect x="360" y="254" width="155" height="70" rx="8"/></g>
  <g text-anchor="middle" font-weight="600" fill="#1c1917"><text x="113" y="203">API</text><text x="275" y="203">Access, policy</text><text x="437" y="203">Flow engine</text><text x="113" y="283">Agents</text><text x="275" y="283">Triggers</text><text x="437" y="283">Decision log</text></g>
  <g text-anchor="middle" font-size="13" fill="#57534e"><text x="113" y="225">/chat · MCP</text><text x="275" y="225">projects · Cedar</text><text x="437" y="225">CNCF SWF</text><text x="113" y="305">a turn = a run</text><text x="275" y="305">web · cron · topic</text><text x="437" y="305">allow and deny</text></g>
  <!-- resources -->
  <rect x="560" y="130" width="140" height="210" rx="12" fill="#fff" stroke="#c9c2b6"/>
  <text x="630" y="158" text-anchor="middle" font-weight="700" fill="#1c1917">Resources</text>
  <g text-anchor="middle" font-size="13" fill="#57534e"><text x="630" y="190">LLMs</text><text x="630" y="216">MCP tools</text><text x="630" y="242">databases</text><text x="630" y="268">file storage</text><text x="630" y="294">secrets</text></g>
  <!-- ADB -->
  <rect x="20" y="400" width="330" height="220" rx="12" fill="#f3eefb" stroke="#5530a8"/>
  <text x="38" y="430" font-weight="700" font-size="16" fill="#5530a8">ADB — the agent database</text>
  <g font-size="14" fill="#44403c"><text x="38" y="462">Agent memory: working, episodic,</text><text x="38" y="482">semantic, procedural, tools</text><text x="38" y="512">Platform data: projects, agents,</text><text x="38" y="532">templates, keys, flows</text><text x="38" y="562">Run queue and step journal</text><text x="38" y="596" font-size="13" fill="#57534e">3 nodes · AQL and SQL</text></g>
  <!-- runtimes -->
  <rect x="370" y="400" width="330" height="220" rx="12" fill="#fdf3e7" stroke="#c47028"/>
  <text x="388" y="430" font-weight="700" font-size="16" fill="#c47028">Controller and runtimes</text>
  <g font-size="14" fill="#44403c"><text x="388" y="462">A deployed agent or flow gets</text><text x="388" y="482">its own runtime pod</text><text x="388" y="512">Runtimes take work from ADB</text><text x="388" y="532">and answer there</text><text x="388" y="562">Pause, resume, undeploy</text><text x="388" y="596" font-size="13" fill="#57534e">Kubernetes</text></g>
  <!-- arrows -->
  <g stroke="#57534e" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M100,82 L100,128"/><path d="M275,82 L275,128"/><path d="M450,82 L450,128"/>
    <path d="M622,82 L622,106 L515,106 L515,128"/>
    <path d="M530,235 L558,235"/>
    <path d="M185,340 L185,398"/>
    <path d="M450,340 L450,398"/>
    <path d="M350,510 L368,510" marker-start="url(#a)"/>
  </g>
  <g font-size="12.5" fill="#57534e"><text x="530" y="100">who signed in</text><text x="194" y="374">memory, data, runs</text><text x="459" y="374">deploy</text></g>
</svg>
