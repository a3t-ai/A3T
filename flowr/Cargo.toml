[workspace]
resolver = "2"
# FlowR: one workspace (flowr-ce and flowr merged 19 Nov 2026).
members = [
    "crates/flowr-ce-core",
    "crates/flowr-ce-storage",
    "crates/flowr-ce-agents",
    "crates/flowr-ce",
    "crates/flowr-server",
    "crates/flowr-canvas",
]
exclude = [
    # Security (Cedar, OIDC, policy files). Built only via
    # `flowr-server --features ee`, so it stays out of the default build.
    "crates/a3t-security",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["A3T"]
license = "Elastic-2.0"

[workspace.dependencies]
# ADB's engine, embedded (stage H: FlowR's engine store is ADB; the local build
# runs it in-process). The sibling ADB checkout, like AQL.
adb-executor = { path = "../../ADB/crates/adb-executor" }
adb-core = { path = "../../ADB/crates/adb-core" }
# CNCF Serverless Workflow crates
swf-parser = { path = "../shared/swf-parser" }
swf-runtime = { path = "../shared/swf-runtime" }

# Shared crates (../shared)
flowr-expr = { path = "../shared/flowr-expr" }
flowr-types = { path = "../shared/flowr-types" }
flowr-storage = { path = "../shared/flowr-storage" }
flowr-core = { path = "../shared/flowr-core" }
flowr-mcp-core = { path = "../shared/flowr-mcp-core" }
flowr-policy = { path = "../shared/flowr-policy" }
flowr-metrics = { path = "../shared/flowr-metrics" }

# This workspace's crates
flowr-ce-core = { path = "crates/flowr-ce-core" }
flowr-ce-storage = { path = "crates/flowr-ce-storage" }
flowr-ce-agents = { path = "crates/flowr-ce-agents" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Filesystem utilities
dirs = "6.0"

# LanceDB storage
lancedb = "0.41.0"
arrow = { version = "58.4.1", default-features = false }
arrow-schema = "58.4.1"
arrow-array = "58.4.1"

# In-memory channels for queue/events
tokio-stream = { version = "0.1", features = ["sync"] }

# HTTP server (for SSE mode)
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }

# Static linking for lzma
lzma-sys = { version = "*", features = ["static"] }

# ClawDB crate (for IPC mode)
clawdb = { path = "../../AQL/crates/clawdb" }
aql-parser = { path = "../../AQL/crates/aql-parser" }

# ADB takes the AQL parser from git; FlowR builds against the sibling AQL
# checkout. One parser for both (stage H).
[patch."https://github.com/a3t-ai/AQL.git"]
aql-parser = { path = "../../AQL/crates/aql-parser" }

# ADB's crates (embedded ADB) need ADB's copy of Lance (third_party/lance: compaction
# into a target base, S3 option B); a patch applies only from the workspace built.
[patch.crates-io]
lance = { path = "../../ADB/third_party/lance" }

# Test images (deploy.sh BUILD_PROFILE=perf) and benchmarks: release optimisation
# without LTO, so it builds fast; the shipped images keep [profile.release].
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
