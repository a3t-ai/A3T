[package]
name = "a3t-security"
description = "A3T security: Cedar authorization (PolicyHook), org/agent policy files, OIDC verification and identity-provider admin"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"

[dependencies]
# The version (hash) of each compiled policy set, named on every decision (AUD-2).
sha2 = "0.10"
# The policy contract it implements (PolicyHook, ExecutionRequest, actions).
flowr-policy = { path = "../../../shared/flowr-policy" }
cedar-policy = "4"
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Org policy and role files (config-to-code, policy_files.rs).
serde_yaml = "0.9"
# OIDC: RS256 verification against a JWKS endpoint, and the IdP admin API.
jsonwebtoken = { version = "9", features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
