document:
  dsl: 1.0.3
  namespace: system
  name: a3t-error-handler
  version: 1.0.0
  metadata:
    description: >
      The A3T base's error handler (UX ST-1, F4/F5). A flow that declares
      metadata.a3t.onError: system/a3t-error-handler hands every uncaught failure
      here. It classifies the error (policy, transient, limit, input, bug), writes
      one row to a3t_errors, and answers the plain-language message the run then
      fails with. Input (from the engine): { error: {type, status, title, detail,
      instance}, flow, version, run_id, principal, step }. Output: { class, type,
      status, title, user_message, ref }. Logging never blocks the answer.
# Called while another run is failing: nothing to resume, so no step journal.
metadata:
  a3t:
    durability: transient
do:
- classify:
    set:
      e: '${ .error // {} }'
      flow: '${ .flow // "" }'
      version: '${ .version // "" }'
      run_id: '${ .run_id // "" }'
      principal: '${ .principal // "" }'
      step: '${ .step // (.error.instance // "") }'
      kind: '${ ((.error.type // "") | split("/") | last) }'
      # ADB's stable code (DB-18), tagged by call:adb as a trailing [adb:<code>].
      adb: '${ (.error.detail // "") | [capture("\\[adb:(?<c>[a-z_]+)\\]$") | .c] | .[0] }'
      why: '${ (.error.detail // "") | sub(" \\[adb:[a-z_]+\\]$"; "") | sub("^ADB: "; "") }'
      class: >-
        ${ (.error // {}) as $e
        | ((($e.detail // "") | [capture("\\[adb:(?<c>[a-z_]+)\\]$") | .c] | .[0])) as $adb
        | (($e.type // "") | split("/") | last) as $k
        | ($e.status // 500) as $s
        | ((($e.detail // "") + " " + ($e.title // "")) | ascii_downcase) as $d
        | if $adb != null then
            (if ["forbidden", "sealed_key"] | index($adb) then "policy"
             elif $adb == "timeout" then "limit"
             elif ["internal", "wrong_engine", "durable_required", "unauthorized"] | index($adb) then "bug"
             else "input" end)
          elif $k == "authorization" or $s == 403 then "policy"
          elif ($k | test("limit|budget")) then "limit"
          elif $k == "timeout" or $s == 408 or $s == 429 or $s == 503 or $s == 504
               or ($d | test("rate.?limit|too many requests|\\b429\\b|timed? ?out|temporar|connection (reset|refused|closed)|unavailable|overloaded"))
            then "transient"
          elif $k == "validation" or $s == 400 or $s == 404 or $s == 409 or $s == 422 then "input"
          else "bug" end }
    export:
      as: .
- word:
    set:
      title: >-
        ${ {"policy": "Not allowed", "transient": "Unavailable", "limit": "Limit reached",
            "input": "Couldn't do that", "bug": "Failed"}[$context.class] }
      user_message: >-
        ${ ($context.why // "" | if length > 300 then .[0:300] + "…" else . end) as $why
        | if $context.class == "policy" then "Not allowed: " + $why + ". Ask an admin if you need this."
          elif $context.class == "transient" then "A service A3T depends on didn't answer in time. Please try again in a minute."
          elif $context.class == "limit" then "This hit a limit: " + $why + "."
          elif $context.class == "input" then "Couldn't do that: " + $why
          else "Something failed on our side. Reference: " + $context.run_id + "." end }
    export:
      as: .
- log:
    try:
      do:
      - insert:
          call: lancedb
          with:
            operation: insert
            table: a3t_errors
            records:
            - id: '${ "err-" + $context.run_id + "-" + (now | tostring) }'
              created_at: '${ now | todateiso8601 }'
              class: '${ $context.class }'
              code: '${ if $context.adb then "adb." + $context.adb else $context.class + "." + $context.kind end }'
              status: '${ ($context.e.status // 500) | tostring }'
              type: '${ $context.e.type // "" }'
              title: '${ $context.e.title // "" }'
              detail: '${ $context.e.detail // "" }'
              flow: '${ $context.flow }'
              version: '${ $context.version }'
              step: '${ $context.step // "" | tostring }'
              run_id: '${ $context.run_id }'
              principal: '${ $context.principal }'
              user_message: '${ $context.user_message }'
            _resource: a3t/a3t-platform-db
      catch:
        do:
        - not-logged:
            set:
              logged: false
- answer:
    set:
      class: '${ $context.class }'
      type: '${ "https://a3t.io/errors/" + $context.class }'
      status: '${ $context.e.status // 500 }'
      title: '${ $context.title }'
      user_message: '${ $context.user_message }'
      ref: '${ $context.run_id }'

